id: crispy-spiced-chicken-garlic-yoghurt
title: Crispy Spiced Chicken with Garlic Yoghurt
titleHtml: Crispy Spiced Chicken with <em>Garlic Yoghurt</em>
label: Main course
servings: 3–4
time: 30 min
timeMins: 30
cookedIn: Air fryer
description: Crispy air-fried chicken thighs in ras el hanout on cool garlic yoghurt, with paprika and chilli butter poured over. Adapted from BBC Food's crispy za'atar chicken.
tags:
  - chicken
ingredients:
  - name: Chicken thighs
    amount: '8'
    prep: boneless, skin-on (about 800g)
  - name: Ras el hanout
    amount: 1½ tbsp
  - name: Sesame seeds
    amount: 1 tbsp
    prep: optional, for extra crunch
  - name: Olive oil
    amount: 1 tbsp
  - name: Salt
    amount: to taste
  - name: Black pepper
    amount: to taste
  - name: Greek yoghurt
    amount: 300g
    prep: full-fat
  - name: Garlic cloves
    amount: '1'
    prep: large, finely grated or crushed
  - name: Salt
    amount: 1 pinch
    prep: for the yoghurt
  - name: Butter
    amount: 50g
  - name: Paprika
    amount: 1 tsp
  - name: Chilli flakes
    amount: ½ tsp
  - name: Crusty bread
    amount: to serve
    prep: optional
steps:
  - title: Heat the air fryer
    content: Preheat the air fryer to 200°C.
  - title: Season the chicken
    content: Pat the chicken thighs dry with kitchen paper and put them in a large bowl. Add the ras el hanout, sesame seeds (if using) and olive oil, season with salt and pepper, and toss until every thigh is evenly coated.
  - title: Air fry
    content: Lay the thighs skin-side down in a single layer in the basket (cook in batches if needed). Cook for 10 minutes, turn them over, then cook for another 10–15 minutes until the skin is crisp and the juices run clear with no pink in the thickest part.
    timer: ⏱ 20–25 minutes
  - title: Make the garlic yoghurt
    content: While the chicken cooks, mix the yoghurt with the garlic and a good pinch of salt. Keep it in the fridge until you're ready to serve.
  - title: Make the spiced butter
    content: Just before the chicken is done, melt the butter in a small pan over a medium heat. Stir in the paprika and chilli flakes and cook for 30 seconds, stirring all the time, then take it off the heat.
    timer: ⏱ 30 seconds
  - title: Serve
    content: Spread the garlic yoghurt over plates or shallow bowls, sit the chicken on top and spoon over the spiced butter. Serve straight away with crusty bread and a green salad.
notes: The quantities of chicken, ras el hanout, oil, butter and spices are estimates — the BBC Food original didn't list them. That version uses za'atar instead of ras el hanout and pul biber (Turkish chilli flakes) instead of paprika and chilli flakes, so swap back if you have them. The yoghurt amount is from the original. No air fryer? Roast at 220°C (200°C fan) until crisp and cooked through — it'll take longer, so check from 25 minutes. Serves 4 with sides, depending on the size of the thighs; a chickpea salad makes it go further.
