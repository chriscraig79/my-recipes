id: cajun-slaw
title: Cajun Slaw
titleHtml: Cajun <em>Slaw</em>
label: Side dish
servings: '4'
time: 45 min
timeMins: 45
extra: Incl. rest time
oven: false
description: A tangy, crunchy slaw with a Cajun kick — mandolin-sliced cabbage, carrot, and onion in a punchy vinegar and mayo dressing. Perfect alongside Cajun fries, pulled pork, or fried chicken.
tags:
  - cabbage
  - carrot
ingredients:
  - name: Purple cabbage
    amount: ½ head
    prep: thinly sliced
  - name: Carrots
    amount: '2'
    prep: thinly sliced
  - name: Red onions
    amount: ½
    prep: thinly sliced
  - name: Salt
    amount: 1 tsp
    prep: for drawing out the cabbage
  - name: Mayonnaise
    amount: 4 tbsp
  - name: Red wine vinegar
    amount: 2 tbsp
  - name: Vegetable oil
    amount: 2 tbsp
  - name: Cajun seasoning
    amount: 1½ tsp
  - name: Salt
    amount: ½ tsp
  - name: Black pepper
    amount: ¼ tsp
steps:
  - title: Slice the vegetables
    content: Using a mandolin, thinly slice the cabbage, carrots, and onion into a large bowl. A mandolin gives you the fine, even shreds that make a slaw properly crunchy — take care with the guard.
  - title: Salt and drain the cabbage
    content: Transfer the sliced cabbage to a colander and toss with 1 tsp salt. Let it sit for 15 minutes — this draws out excess water so the slaw stays crunchy instead of turning watery. Squeeze or pat dry with a clean tea towel, then combine with the carrots and onion.
    timer: ⏱ 15 minutes
  - title: Make the dressing
    content: In a separate small bowl or jug, whisk together the oil, red wine vinegar, Cajun seasoning, salt, and pepper. Once combined, whisk in the mayonnaise until smooth.
  - title: Toss and rest
    content: Pour the dressing over the vegetables and toss well until everything is evenly coated. Cover and rest in the fridge for at least 15 minutes — longer if you have time — to let the flavours come together.
    timer: ⏱ Rest 15 minutes+
  - title: Serve
    content: Give it a final toss and taste, adjusting salt or vinegar if needed. Serve alongside Cajun fries, pulled pork, or fried chicken.
notes: Slicing everything on a mandolin keeps the pieces fine and even, which makes for a better slaw than chopping by hand — just use the guard. Salting and draining the cabbage first is the step that keeps it crunchy rather than watery, especially if it's sitting around before serving. It keeps well in the fridge for 2–3 days, and the flavour actually improves after a few hours as it marinates. For more heat, add an extra pinch of cayenne or a dash of hot sauce to the dressing.
