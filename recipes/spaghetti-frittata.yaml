id: spaghetti-frittata
title: Spaghetti Frittata
titleHtml: Spaghetti <em>Frittata</em>
label: Light meal
servings: '4'
time: 35 min
timeMins: 35
extra: One pan
oven: false
description: A clever way to use up leftover spaghetti — bound in egg and Parmesan with softened onion and herbs, and flipped to crisp on both sides.
tags:
  - pasta
  - eggs
ingredients:
  - name: Whole-wheat spaghetti
    amount: 8 oz
    prep: uncooked (or 4 cups cooked)
  - name: Extra-virgin olive oil
    amount: 4 tsp
  - name: Onions
    amount: 3 medium
    prep: chopped
  - name: Large eggs
    amount: '4'
  - name: Milk
    amount: ½ cup
  - name: Parmesan
    amount: ⅓ cup
    prep: grated
  - name: Fresh parsley
    amount: 2 tbsp
    prep: chopped
  - name: Fresh basil
    amount: 2 tbsp
    prep: chopped
  - name: Salt
    amount: 1 tsp
  - name: Black pepper
    amount: ½ tsp
  - name: Tomato
    amount: '1'
    prep: diced (optional)
steps:
  - title: Cook the spaghetti
    content: Cook the spaghetti in a large pot of boiling water until just tender, 8–10 minutes. Drain and refresh with cold water. Skip this step if using leftover spaghetti.
    timer: ⏱ 8–10 minutes
  - title: Soften the onions
    content: Heat the oil in a large ovenproof nonstick skillet over medium heat. Add the onions and cook, stirring occasionally, until golden, 10–12 minutes. Transfer to a bowl to cool slightly and wipe out the pan.
    timer: ⏱ 10–12 minutes
  - title: Mix the batter
    content: Whisk the eggs and milk together in a large bowl. Stir in the onions, Parmesan, parsley, basil, salt and pepper, then add the spaghetti.
  - title: Cook the first side
    content: Coat the pan well with cooking spray and set over medium heat. Pour in the egg mixture, spreading evenly. Cook until the underside is golden, turning the pan occasionally for even cooking, 3–5 minutes.
    timer: ⏱ 3–5 minutes
  - title: Flip and finish
    content: Invert a large platter over the pan and carefully turn the frittata out onto it. Spray the pan again, slide the frittata back in, and cook until the bottom is golden. Slide back onto the platter and garnish with the diced tomato, if using.
notes: A good way to use up leftover spaghetti rather than cooking a fresh batch — just skip straight to whisking it into the egg mixture. The flip is the trickiest part; use a platter bigger than the pan and commit to it in one confident move. From eatingwell.com.
