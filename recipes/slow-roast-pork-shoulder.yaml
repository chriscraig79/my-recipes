id: slow-roast-pork-shoulder
title: Slow Roast Pork Shoulder with Fennel, Apples & Cider
titleHtml: Slow Roast Pork <em>Shoulder</em> with Fennel, Apples & Cider
label: Main course
servings: '10'
time: 4 hrs
timeMins: 240
cookedIn: Oven
description: A big shoulder joint roasted slowly on apples and onions until it's tender, with fennel-salt crackling and a sweet cider sauce made in the tin.
tags:
  - pork
  - roast
ingredients:
  - name: Pork shoulder
    amount: 2.4kg
    prep: skin on and scored
  - name: Salt
    amount: 1½ tbsp
    prep: sea salt flakes
  - name: Fennel seeds
    amount: 2 tsp
  - name: Olive oil
    amount: 2 tbsp
  - name: Onions
    amount: '2'
    prep: quartered
  - name: Crisp eating apples
    amount: '4'
    prep: quartered and cored
  - name: Garlic cloves
    amount: '5'
    prep: bashed
  - name: Cider
    amount: 250ml
    prep: sweet or dry
  - name: Dijon mustard
    amount: 1 tsp
    prep: or wholegrain, optional
steps:
  - title: Dry the skin
    content: Unwrap the pork and pat the skin completely dry with kitchen paper. If you have time, leave it uncovered in the fridge overnight, which is the best way to get good crackling. Take it out 30–60 minutes before cooking.
    timer: ⏱ Ideally overnight
  - title: Heat the oven
    content: Preheat the oven to 240°C (220°C fan).
  - title: Season
    content: Crush the fennel seeds with the salt using a pestle and mortar, or the bottom of a mug. Rub the olive oil over the skin, then work the fennel salt into the score lines.
  - title: Build the tin
    content: Scatter the onions, apples and garlic in a roasting tin and sit the pork on top, skin side up.
  - title: Blast for crackling
    content: Roast for 30 minutes, until the skin starts to blister and puff.
    timer: ⏱ 30 minutes
  - title: Slow roast
    content: Turn the oven down to 170°C (150°C fan). Pour the cider and 150ml water into the tin, not over the skin. Roast for about 3 hours, until a fork slides easily into the meat. Check after 90 minutes and add a splash of water if the tin looks dry.
    timer: ⏱ 3 hours
  - title: Rest and make the sauce
    content: Lift the pork onto a board and rest it uncovered for 20–30 minutes, so the crackling stays crisp. Meanwhile, squash the soft apples and onions into the tin juices. Stir in the mustard to balance the sweetness of the cider, then taste and add salt if needed.
    timer: ⏱ 20–30 minutes
notes: Shoulder is very forgiving, so an extra 30 minutes won't hurt. If you want to pull the meat rather than slice it, give it closer to 4 hours at the low temperature. If the crackling still isn't crisp, slice it off after resting and put it under a hot grill for a few minutes, watching it closely. With sweet cider the sauce comes out sweeter, which is what the mustard is for; with dry cider you can leave the mustard out. Sage or rosemary also work well tucked under the pork if you have any.
