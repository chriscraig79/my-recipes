<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --warm-white: #faf7f2;
    --ink: #1c1812;
    --muted: #6b5f4e;
    --accent: #b5470a;
    --border: #d9cfc0;
    --rule: #c4b8a4;
  }

  body {
    background: var(--warm-white);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── Index ── */
  #index {
    max-width: 680px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }

  .site-header {
    border-top: 3px solid var(--ink);
    padding: 2rem 0 1.5rem;
    margin-bottom: 2rem;
  }

  .site-header::after {
    content: '';
    display: block;
    border-bottom: 3px solid var(--ink);
    margin-top: 1.5rem;
  }

  .site-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .site-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    font-weight: 600;
    line-height: 1.05;
  }

  .site-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  /* ── Filters ── */
  .filters {
    margin-bottom: 2rem;
  }

  .filter-group {
    margin-bottom: 1rem;
  }

  .filter-label {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
    display: block;
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .chip {
    font-family: 'Source Serif 4', serif;
    font-size: 0.78rem;
    font-weight: 300;
    padding: 0.25rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--warm-white);
  }

  .results-count {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rule);
    margin-bottom: 1rem;
  }

  /* ── Recipe list ── */
  .recipe-list { list-style: none; }

  .recipe-list-item {
    border-bottom: 1px solid var(--border);
  }

  .recipe-list-item:first-child {
    border-top: 1px solid var(--border);
  }

  .recipe-card-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 1.25rem 0;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
    gap: 1rem;
    transition: color 0.15s;
  }

  .recipe-card-btn:hover { color: var(--accent); }
  .recipe-card-btn:hover .recipe-card-arrow { transform: translateX(4px); }

  .recipe-card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 600;
    display: block;
    margin-bottom: 0.25rem;
  }

  .recipe-card-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.4rem;
  }

  .recipe-chip {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.1rem 0.45rem;
    border-radius: 2px;
  }

  .recipe-chip.time { color: var(--accent); border-color: var(--accent); opacity: 0.7; }

  .recipe-card-desc {
    font-size: 0.88rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    margin-top: 0.2rem;
  }

  .recipe-card-arrow {
    font-size: 1.2rem;
    color: var(--accent);
    flex-shrink: 0;
    transition: transform 0.15s;
  }

  .no-results {
    padding: 2rem 0;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    border-top: 1px solid var(--border);
  }

  /* ── Recipe view ── */
  #recipe-view {
    display: none;
    max-width: 680px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }

  .back-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Source Serif 4', serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0;
    margin-bottom: 2rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: color 0.15s;
  }

  .back-btn:hover { color: var(--accent); }

  .recipe-header {
    border-top: 3px solid var(--ink);
    border-bottom: 1px solid var(--rule);
    padding: 2rem 0 1.5rem;
    margin-bottom: 2.5rem;
  }

  .recipe-header::after {
    content: '';
    display: block;
    border-bottom: 3px solid var(--ink);
    margin-top: 1.5rem;
  }

  .recipe-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .recipe-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 600;
    line-height: 1.1;
  }

  .recipe-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  .recipe-description {
    margin-top: 1rem;
    font-size: 1rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
  }

  .recipe-meta {
    display: flex;
    gap: 2rem;
    margin-top: 1.25rem;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-transform: uppercase;
    flex-wrap: wrap;
  }

  .recipe-meta span strong {
    color: var(--ink);
    display: block;
    font-size: 1.1rem;
    text-transform: none;
    letter-spacing: 0;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
  }

  section.recipe-section { margin-bottom: 2.5rem; }

  h2.section-heading {
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
    margin-bottom: 1.25rem;
  }

  h2.section-heading--no-gap {
    margin-bottom: 0;
  }

  .ingredients-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .ingredient {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    gap: 1rem;
    font-size: 0.95rem;
  }

  .ingredient:nth-child(odd) { padding-right: 1.5rem; }
  .ingredient:nth-child(even) { padding-left: 1.5rem; border-left: 1px solid var(--border); }

  .ingredient-amount {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    font-size: 0.9rem;
  }

  .step {
    display: grid;
    grid-template-columns: 2.5rem 1fr;
    gap: 0 1.25rem;
    margin-bottom: 1.5rem;
    align-items: start;
  }

  .step-number {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--border);
    line-height: 1;
    text-align: right;
    padding-top: 0.1rem;
  }

  .step-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
  }

  .step-content {
    font-size: 0.93rem;
    color: #3d3427;
    line-height: 1.65;
  }

  .step-timer {
    display: inline-block;
    margin-top: 0.4rem;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.15rem 0.5rem;
    border-radius: 2px;
    opacity: 0.8;
  }

  .notes-box {
    background: var(--cream);
    border-left: 3px solid var(--accent);
    padding: 1.25rem 1.5rem;
    font-size: 0.88rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.7;
  }

  .footer-rule {
    border: none;
    border-top: 3px solid var(--ink);
    margin-top: 3rem;
  }

  @media (max-width: 500px) {
    .ingredients-grid { grid-template-columns: 1fr; }
    .ingredient:nth-child(even) { padding-left: 0; border-left: none; }
    .ingredient:nth-child(odd) { padding-right: 0; }
  }
</style>
</head>
<body>

<div id="index">
  <header class="site-header">
    <p class="site-label">Recipe collection</p>
    <h1 class="site-title">My <em>Recipes</em></h1>
  </header>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Ingredient</span>
      <div class="filter-chips" id="ingredient-chips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Time</span>
      <div class="filter-chips" id="time-chips"></div>
    </div>
  </div>

  <p class="results-count" id="results-count"></p>
  <ul class="recipe-list" id="recipe-list"></ul>
</div>

<div id="recipe-view">
  <button class="back-btn" onclick="showIndex()">← All recipes</button>
  <div id="recipe-content"></div>
</div>

<script>
// ─────────────────────────────────────────────
//  RECIPE DATA
//
//  Each recipe needs:
//    id         — unique slug, no spaces
//    title      — plain text, for the index list
//    titleHtml  — can include <em> for italic styling
//    label      — e.g. "Main course", "Pasta"
//    servings   — e.g. "4"
//    time       — display string e.g. "1 hr 15 min"
//    timeMins   — number, used for time band filter
//    extra      — third meta item e.g. oven temp
//    description
//    tags       — array of ingredient strings e.g. ["pork", "potato"]
//    ingredients — array of { name, amount }
//    steps      — array of { title, content, timer? }
//    notes
// ─────────────────────────────────────────────

const recipes = [
  {
    id: "gratin",
    title: "Gammon & Potato Gratin",
    titleHtml: "Gammon <em>&</em> Potato Gratin",
    label: "Main course",
    servings: "4",
    time: "1 hr 15 min",
    timeMins: 75,
    extra: "180°C / fan 160°C",
    oven: true,
    description: "Rich, creamy layers of potato and gammon baked until golden and bubbling. A great way to use up a leftover joint.",
    tags: ["pork", "potato"],
    ingredients: [
      { name: "Maris Piper potatoes", amount: "800g" },
      { name: "Cooked gammon, diced or shredded", amount: "300g" },
      { name: "Single cream", amount: "400ml" },
      { name: "Cheddar or gruyère, grated", amount: "100g" },
      { name: "Garlic cloves, minced", amount: "2" },
      { name: "Dijon mustard", amount: "1 tbsp" },
      { name: "Nutmeg, grated", amount: "¼ tsp" },
      { name: "Black pepper", amount: "½ tsp" },
    ],
    steps: [
      { title: "Preheat oven", content: "Heat your oven to 180°C (160°C fan). Lightly butter a medium baking dish — roughly 30×20cm works well." },
      { title: "Slice the potatoes", content: "Peel and slice as thinly as you can — around 3–4mm. A mandoline is ideal, but a sharp knife is fine. Don't rinse them after slicing; the starch helps the sauce thicken." },
      { title: "Make the cream sauce", content: "In a jug, mix together the cream, mustard, nutmeg, pepper, and minced garlic. Taste it — it should be well seasoned, but go easy on salt since the gammon will add plenty." },
      { title: "Layer up", content: "Arrange a layer of potato slices in the dish, slightly overlapping. Scatter over some gammon, then pour over a little of the cream mixture. Repeat the layers until everything is used up, finishing with a top layer of potatoes. Pour any remaining cream over the top." },
      { title: "Add cheese and cover", content: "Scatter the grated cheese evenly over the top. Cover the dish tightly with foil." },
      { title: "Bake covered", content: "Bake covered for 45 minutes.", timer: "⏱ 45 minutes" },
      { title: "Bake uncovered", content: "Remove the foil and bake for a further 20–25 minutes until the top is golden and a knife slides easily through the potatoes.", timer: "⏱ 20–25 minutes" },
      { title: "Rest and serve", content: "Leave to rest for 10 minutes before serving — it'll hold together much better. Serve with a green salad or steamed greens.", timer: "⏱ Rest 10 minutes" },
    ],
    notes: "The gammon is already cooked and salty, so taste the cream sauce before adding any salt. Gruyère gives a nuttier flavour, cheddar is more robust — either works. With single cream, add a little extra cheese on top and don't skip the resting time; it helps the gratin firm up. Leftovers reheat well the next day, and the flavour actually improves.",
  },
  {
    id: "carbonara",
    title: "Gammon Carbonara",
    titleHtml: "Gammon <em>Carbonara</em>",
    label: "Pasta",
    servings: "2",
    time: "20 min",
    timeMins: 20,
    extra: "No cream needed",
    description: "A weeknight carbonara using leftover gammon in place of pancetta. Rich, silky, and ready in 20 minutes.",
    tags: ["pork", "eggs", "pasta"],
    ingredients: [
      { name: "Spaghetti or rigatoni", amount: "200g" },
      { name: "Cooked gammon, diced small", amount: "150g" },
      { name: "Large eggs", amount: "3" },
      { name: "Egg yolk", amount: "1" },
      { name: "Parmesan or pecorino, grated", amount: "50g" },
      { name: "Garlic clove", amount: "1" },
      { name: "Black pepper, coarsely ground", amount: "1 tsp" },
      { name: "Olive oil", amount: "1 tbsp" },
    ],
    steps: [
      { title: "Boil the pasta", content: "Bring a large pan of well-salted water to the boil and cook the pasta until al dente according to packet instructions. Before draining, scoop out a mugful of the starchy pasta water — you'll need it for the sauce.", timer: "⏱ ~10 minutes" },
      { title: "Mix the sauce", content: "While the pasta cooks, whisk together the 3 eggs, 1 egg yolk, and most of the parmesan in a bowl. Season with the black pepper. The mixture should be thick and pale — this is your sauce. Don't add salt; the gammon and cheese will take care of that." },
      { title: "Fry the gammon", content: "Heat the olive oil in a wide frying pan over medium heat. Add the whole garlic clove and let it sizzle for a minute, then remove it. Add the gammon and fry for 2–3 minutes until the edges start to colour slightly.", timer: "⏱ 3 minutes" },
      { title: "Combine off the heat", content: "Turn the heat off completely — this is important, or the eggs will scramble. Add the drained pasta to the pan and toss well. Pour the egg and cheese mixture over, tossing quickly and adding splashes of the reserved pasta water to loosen it into a glossy, silky sauce. You want it creamy, not dry." },
      { title: "Serve immediately", content: "Divide between warm bowls. Finish with the remaining parmesan and an extra grind of black pepper." },
    ],
    notes: "The key is taking the pan off the heat before adding the egg mixture — residual heat is enough to cook it into a sauce without scrambling. Gammon is saltier than pancetta so don't add salt until you've tasted at the end. A splash more pasta water than you think you need is always better than too little.",
  },
  {
    id: "thai-chicken-curry",
    title: "Green Thai Chicken Curry",
    titleHtml: "Green Thai <em>Chicken Curry</em>",
    label: "Main course",
    servings: "4",
    time: "40 min",
    timeMins: 40,
    extra: "One pan",
    oven: false,
    description: "A fragrant, from-scratch green curry paste with coconut milk and chicken breast. Fresh and aromatic without needing a specialist shop.",
    tags: ["chicken"],
    ingredients: [
      { name: "Chicken breasts, cut into bite-sized pieces", amount: "600g" },
      { name: "Coconut milk, full fat tin", amount: "400ml" },
      { name: "Vegetable or chicken stock", amount: "150ml" },
      { name: "Fish sauce", amount: "2 tbsp" },
      { name: "Lime juice", amount: "1 tbsp" },
      { name: "Brown sugar", amount: "1 tsp" },
      { name: "Vegetable oil", amount: "1 tbsp" },
      { name: "Green chillies, mild or hot to taste", amount: "3" },
      { name: "Garlic cloves", amount: "4" },
      { name: "Fresh ginger, roughly chopped", amount: "3 tbsp" },
      { name: "Spring onions, roughly chopped", amount: "4" },
      { name: "Ground coriander", amount: "1 tsp" },
      { name: "Ground cumin", amount: "1 tsp" },
      { name: "Lime zest", amount: "1 tsp" },
      { name: "Fresh coriander, stalks and leaves", amount: "30g" },
      { name: "Jasmine or basmati rice, to serve", amount: "300g" },
    ],
    steps: [
      { title: "Make the paste", content: "Blitz the chillies, garlic, ginger, spring onions, ground coriander, ground cumin, lime zest, and coriander stalks (save leaves for later) in a small food processor or blender with a splash of water until you have a rough paste. A stick blender in a jug works well too." },
      { title: "Cook the paste", content: "Heat the oil in a wide pan or wok over medium-high heat. Add the paste and fry for 2–3 minutes, stirring constantly, until fragrant and starting to darken slightly.", timer: "⏱ 2–3 minutes" },
      { title: "Add coconut milk", content: "Pour in the coconut milk and stir to combine with the paste. Let it come to a gentle simmer." },
      { title: "Cook the chicken", content: "Add the chicken and stock. Simmer gently for 12–15 minutes until the chicken is cooked through. Don't boil hard or the chicken will tighten up.", timer: "⏱ 12–15 minutes" },
      { title: "Season", content: "Stir in the fish sauce, lime juice, and sugar. Taste and adjust — more fish sauce for saltiness, more lime for brightness, more sugar to balance. This is where you get it right." },
      { title: "Cook the rice", content: "Cook the rice according to packet instructions while the curry simmers.", timer: "⏱ ~12 minutes" },
      { title: "Serve", content: "Ladle over rice and scatter with the reserved fresh coriander leaves. A wedge of lime on the side doesn't hurt." },
    ],
    notes: "The paste works best with lemongrass if you can get it — bash a stalk and blitz it in with everything else. Kaffir lime leaves added to the simmering curry add a lot of fragrance. If you want more veg, baby spinach, courgette, or sugar snaps all work well added in the last 5 minutes. Fish sauce is salty, so don't add extra salt — taste first.",
  },
  {
    id: "spanish-tortilla",
    title: "Spanish Tortilla",
    titleHtml: "Spanish <em>Tortilla</em>",
    label: "Light meal",
    servings: "4",
    time: "45 min",
    timeMins: 45,
    extra: "One pan",
    oven: false,
    description: "The real thing — potato, onion, eggs, olive oil. Served warm or at room temperature, it's one of the great simple dishes.",
    tags: ["eggs", "potato"],
    ingredients: [
      { name: "Waxy potatoes, peeled and thinly sliced", amount: "600g" },
      { name: "Onion, halved and thinly sliced", amount: "1" },
      { name: "Large eggs", amount: "6" },
      { name: "Olive oil", amount: "200ml" },
      { name: "Salt", amount: "1 tsp" },
    ],
    steps: [
      { title: "Confit the potatoes and onion", content: "Pour the olive oil into a medium frying pan (about 24cm) over low-medium heat. Add the potatoes and onion with the salt. Cook gently for 20–25 minutes, turning occasionally, until the potatoes are completely tender but not browned. You're confiting them in oil, not frying — keep the heat low.", timer: "⏱ 20–25 minutes" },
      { title: "Drain and beat the eggs", content: "Lift the potatoes and onion out with a slotted spoon into a bowl, leaving the oil in the pan. Beat the eggs well in a separate large bowl, season with salt, then fold the potato and onion mixture into the eggs. Press down gently so everything is submerged. Leave to rest for 5 minutes.", timer: "⏱ Rest 5 minutes" },
      { title: "Cook the first side", content: "Pour most of the oil out of the pan, leaving just a thin coating. Heat over medium heat. Pour in the egg and potato mixture and spread it level. Cook for 4–5 minutes until the edges are set but the centre still has a wobble.", timer: "⏱ 4–5 minutes" },
      { title: "Flip", content: "This is the moment. Place a large flat plate or lid over the pan, then flip the tortilla onto it in one confident move. Slide it back into the pan, uncooked side down. Tuck the edges under with a spatula to get a neat shape." },
      { title: "Finish the second side", content: "Cook for 2–3 minutes more. The centre should still have a slight give when you press it — that's what you want. It'll continue to set as it rests.", timer: "⏱ 2–3 minutes" },
      { title: "Rest and serve", content: "Slide onto a board or plate and leave to rest for at least 5 minutes before cutting. Serve warm or at room temperature — both are correct.", timer: "⏱ Rest 5 minutes" },
    ],
    notes: "The flip is the only tricky bit — use a plate bigger than the pan and do it decisively. Hesitating is what causes disasters. Waxy potatoes (Charlotte, Désirée, or similar) hold their shape better than floury ones. The tortilla keeps well at room temperature for a few hours and is arguably better the next day cold from the fridge, sliced and eaten as a snack.",
  },
  {
    id: "beef-guinness-stew",
    title: "Beef & Guinness Stew",
    titleHtml: "Beef <em>& Guinness Stew</em>",
    label: "Main course",
    servings: "4",
    time: "3 hrs",
    timeMins: 180,
    extra: "160°C / fan 140°C",
    oven: true,
    description: "A deep, rich stew with fall-apart beef and a dark, slightly bitter gravy. Better the next day, and the day after that.",
    tags: ["beef"],
    ingredients: [
      { name: "Braising steak or chuck, cut into chunks", amount: "800g" },
      { name: "Guinness or stout", amount: "500ml" },
      { name: "Beef stock", amount: "300ml" },
      { name: "Onions, roughly chopped", amount: "2" },
      { name: "Carrots, cut into chunks", amount: "3" },
      { name: "Celery stalks, sliced", amount: "2" },
      { name: "Garlic cloves, minced", amount: "3" },
      { name: "Tomato purée", amount: "2 tbsp" },
      { name: "Worcestershire sauce", amount: "1 tbsp" },
      { name: "Plain flour", amount: "2 tbsp" },
      { name: "Vegetable oil", amount: "2 tbsp" },
      { name: "Bay leaves", amount: "2" },
      { name: "Fresh or dried thyme", amount: "1 tsp" },
      { name: "Salt and black pepper", amount: "1 tsp" },
    ],
    steps: [

// ─────────────────────────────────────────────
//  FILTER STATE & LOGIC
// ─────────────────────────────────────────────

const TIME_BANDS = [
  { label: "Under 30 min", key: "under30", test: m => m < 30 },
  { label: "30–60 min",    key: "30to60",  test: m => m >= 30 && m <= 60 },
  { label: "Over 1 hr",    key: "over60",  test: m => m > 60 },
];

let activeIngredients = new Set();
let activeTime = null;

function getAllTags() {
  const tags = new Set();
  recipes.forEach(r => r.tags.forEach(t => tags.add(t)));
  return [...tags].sort();
}

function getTimeBandsPresent() {
  return TIME_BANDS.filter(band => recipes.some(r => band.test(r.timeMins)));
}

function filteredRecipes() {
  return recipes.filter(r => {
    const ingredientMatch = activeIngredients.size === 0 || [...activeIngredients].every(t => r.tags.includes(t));
    const timeMatch = !activeTime || TIME_BANDS.find(b => b.key === activeTime)?.test(r.timeMins);
    return ingredientMatch && timeMatch;
  });
}

function buildFilters() {
  const ingContainer = document.getElementById('ingredient-chips');
  const timeContainer = document.getElementById('time-chips');

  const tags = getAllTags();
  ingContainer.innerHTML = tags.map(tag => `
    <button class="chip" data-tag="${tag}" onclick="toggleIngredient('${tag}')">${tag}</button>
  `).join('');

  const bands = getTimeBandsPresent();
  timeContainer.innerHTML = bands.map(band => `
    <button class="chip" data-band="${band.key}" onclick="toggleTime('${band.key}')">${band.label}</button>
  `).join('');
}

function toggleIngredient(tag) {
  if (activeIngredients.has(tag)) {
    activeIngredients.delete(tag);
  } else {
    activeIngredients.add(tag);
  }
  updateChips();
  renderList();
}

function toggleTime(key) {
  activeTime = activeTime === key ? null : key;
  updateChips();
  renderList();
}

function updateChips() {
  document.querySelectorAll('#ingredient-chips .chip').forEach(chip => {
    chip.classList.toggle('active', activeIngredients.has(chip.dataset.tag));
  });
  document.querySelectorAll('#time-chips .chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.band === activeTime);
  });
}

// ─────────────────────────────────────────────
//  RENDERING
// ─────────────────────────────────────────────

function renderList() {
  const list = document.getElementById('recipe-list');
  const count = document.getElementById('results-count');
  const results = filteredRecipes();

  count.textContent = `${results.length} recipe${results.length !== 1 ? 's' : ''}`;

  if (results.length === 0) {
    list.innerHTML = '<p class="no-results">No recipes match those filters.</p>';
    return;
  }

  list.innerHTML = results.map(r => {
    const tagChips = r.tags.map(t => `<span class="recipe-chip">${t}</span>`).join('');
    const timeBand = TIME_BANDS.find(b => b.test(r.timeMins));
    const timeChip = timeBand ? `<span class="recipe-chip time">${r.time}</span>` : '';
    return `
      <li class="recipe-list-item">
        <button class="recipe-card-btn" onclick="showRecipe('${r.id}')">
          <div class="recipe-card-text">
            <span class="recipe-card-title">${r.title}</span>
            <div class="recipe-card-chips">${tagChips}${timeChip}</div>
            <span class="recipe-card-desc">${r.description}</span>
          </div>
          <span class="recipe-card-arrow">→</span>
        </button>
      </li>
    `;
  }).join('');
}

function showRecipe(id) {
  const r = recipes.find(r => r.id === id);
  if (!r) return;

  const ingredientsHtml = r.ingredients.map(ing => `
    <div class="ingredient">
      <span class="ingredient-name">${ing.name}</span>
      <span class="ingredient-amount">${ing.amount}</span>
    </div>
  `).join('');

  const stepsHtml = r.steps.map((step, i) => `
    <div class="step">
      <div class="step-number">${i + 1}</div>
      <div class="step-body">
        <div class="step-title">${step.title}</div>
        <div class="step-content">${step.content}</div>
        ${step.timer ? `<span class="step-timer">${step.timer}</span>` : ''}
      </div>
    </div>
  `).join('');

  document.getElementById('recipe-content').innerHTML = `
    <header class="recipe-header">
      <p class="recipe-label">${r.label} — serves ${r.servings}</p>
      <h1 class="recipe-title">${r.titleHtml}</h1>
      <p class="recipe-description">${r.description}</p>
      <div class="recipe-meta">
        <span><strong>${r.time}</strong> total time</span>
        <span><strong>${r.extra}</strong>${r.oven ? ' oven' : ''}</span>
        <span><strong>${r.servings}</strong> servings</span>
      </div>
    </header>

    <section class="recipe-section">
      <h2 class="section-heading section-heading--no-gap">Ingredients</h2>
      <div class="ingredients-grid">${ingredientsHtml}</div>
    </section>

    <section class="recipe-section">
      <h2 class="section-heading">Method</h2>
      <div class="steps">${stepsHtml}</div>
    </section>

    <section class="recipe-section">
      <h2 class="section-heading">Notes</h2>
      <div class="notes-box">${r.notes}</div>
    </section>

    <hr class="footer-rule">
  `;

  document.getElementById('index').style.display = 'none';
  document.getElementById('recipe-view').style.display = 'block';
  window.scrollTo(0, 0);
}

function showIndex() {
  document.getElementById('recipe-view').style.display = 'none';
  document.getElementById('index').style.display = 'block';
  window.scrollTo(0, 0);
}

buildFilters();
renderList();
</script>
