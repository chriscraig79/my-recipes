<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes</title>
<!-- Shown when a link is shared (WhatsApp, Messages, Slack, etc.). The
     page has no visible title, so this is where the site's name and
     description live. -->
<meta name="description" content="Recipe collection &amp; shopping list generator">
<meta property="og:type" content="website">
<meta property="og:site_name" content="My Recipes">
<meta property="og:title" content="My Recipes">
<meta property="og:description" content="Recipe collection &amp; shopping list generator">
<meta property="og:url" content="https://chriscraig79.github.io/my-recipes/">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --warm-white: #faf7f2;
    --card-bg: #ffffff;
    --ink: #1c1812;
    --muted: #6b5f4e;
    --accent: #b5470a;
    --accent-soft: #f1e2d3;
    --border: #d9cfc0;
    --rule: #c4b8a4;
    --step-num: #ece5d8;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-pill: 999px;
    /* Shared card look (index cards, recipe overview, ingredients, steps):
       white, thin border, small soft shadow. */
    --card-border: 1px solid var(--border);
    --shadow-card: 0 1px 2px rgba(28, 24, 18, 0.05), 0 2px 6px rgba(28, 24, 18, 0.05);
    --font-serif: 'Playfair Display', serif;
    --font-body: 'Source Serif 4', Georgia, serif;
    --font-sans: 'Inter', system-ui, sans-serif;
    /* Vertical rhythm for the recipe and shopping list pages: one gap
       between major blocks (header, jump bar, each section), and a smaller
       one between a section heading and its content. Tighter on phones. */
    --space-section: 2.5rem;
    /* Width of the recipe/shopping list column, padding included. */
    --reading-width: 720px;
    --space-heading: 1.25rem;
    /* Space between the site nav and the top of each page's header, the
       same on every page. */
    --page-top: 1.75rem;
  }

  body {
    background: var(--warm-white);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── Index ── */
  #index {
    max-width: 1120px;
    margin: 0 auto;
    padding: var(--page-top) 2rem 5rem;
  }

  /* ── Filters ── */
  /* One joined button group: a dropdown per category (Protein, Carbs, Veg,
     Dish, Time), centred. Segments shrink to fit, so the whole group always
     stays on one line, even on a phone. */
  /* Pinned to the top while scrolling the index, like the recipe jump bar.
     It bleeds out over the index's side padding so the bar spans the screen,
     and gets a bottom rule once it's stuck. */
  .filters {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 0.6rem 2rem;
    margin: -0.6rem -2rem 0.65rem;
    background: var(--warm-white);
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .filters.is-stuck { border-bottom-color: var(--border); }

  /* One pill holds the search button (left edge, never moves) and, in the
     same space beside it, either the filter dropdowns or the search field.
     Opening search fades the filters out and the field in; the one that's
     hidden is also made inert and visibility:hidden once its fade ends, so
     it can't be tabbed to or read out. */
  .filter-shell {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    width: 100%;
    max-width: calc(var(--reading-width) - 4rem);
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--card-bg);
  }

  .search-toggle,
  .search-close {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    min-height: 2.5rem;
    align-self: stretch;
    border: none;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }

  .search-toggle svg,
  .search-close svg { width: 1.25rem; height: 1.25rem; }

  .search-toggle:hover,
  .search-close:hover,
  .search-toggle[aria-expanded="true"] { color: var(--accent); }

  .search-toggle:focus-visible,
  .search-close:focus-visible,
  .search-input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  /* The filters and the search field share the second grid cell. */
  .filter-bar,
  .search-panel {
    grid-column: 2;
    grid-row: 1;
    transition: opacity 0.15s ease, visibility 0s linear 0.15s;
  }

  .search-panel {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    opacity: 0;
    visibility: hidden;
  }

  .filters.is-searching .filter-bar { opacity: 0; visibility: hidden; }
  .filters.is-searching .search-panel {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.15s ease 0.05s, visibility 0s;
  }

  .search-input {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 2.5rem;
    padding: 0.2rem 0.6rem 0.2rem 0.35rem;
    border: none;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--ink);
    font-family: var(--font-sans);
    /* 16px so iOS Safari doesn't zoom the page when the field is focused. */
    font-size: 1rem;
    line-height: 1.2;
  }

  .search-input::placeholder { color: var(--muted); opacity: 1; }
  /* The × beside the field closes search, so hide the browser's own clear button. */
  .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

  @media (prefers-reduced-motion: reduce) {
    .filter-bar, .search-panel,
    .filters.is-searching .search-panel { transition: none; }
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* A segmented control: the segments run the full height of the pill,
     split by thin vertical rules, and a chosen one fills its whole cell in
     orange (the last cell picks up the pill's rounded end). */
  .filter-bar {
    display: flex;
    min-width: 0;
    align-self: stretch;
  }

  /* Each segment gets an equal share of the bar, with its label centred in
     that share, and keeps that share when a choice is made: the chosen
     value is cut short with an ellipsis rather than growing the segment and
     pushing the others along. A category name never gets narrower than its
     label. */
  .filter-seg {
    position: relative;
    flex: 1 1 0;
    min-width: max-content;
    display: flex;
    align-items: stretch;
    border-left: 1px solid var(--border);
    transition: background 0.15s, border-color 0.15s;
  }

  .filter-seg:last-child { border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }

  .filter-trigger {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 2.5rem;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 0;
    background: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s;
  }

  .filter-trigger:hover,
  .filter-trigger[aria-expanded="true"] { color: var(--accent); }

  /* A segment's minimum width comes from its category name (the hidden
     sizer), never from the text showing, so choosing "Under 30 min" in Time
     can't widen it. The shown text fills whatever room the segment has and
     is cut short with an ellipsis if it doesn't fit; the full choice is in
     the button's title and accessible name. */
  .filter-label {
    flex: 1 1 auto;
    display: grid;
    min-width: max-content;
  }

  .filter-sizer,
  .filter-trigger-text {
    grid-area: 1 / 1;
    white-space: nowrap;
  }

  .filter-sizer { visibility: hidden; }

  .filter-trigger-text {
    width: 0;
    min-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  /* Active: the whole cell fills orange (covering its divider too), the
     chosen value becomes the label, and an × beside it clears it. */
  .filter-seg.active { background: var(--accent); border-left-color: var(--accent); }
  /* A chosen cell's width still comes from the bar's equal share, not from
     its category name plus the ×, so choosing never pushes the others along. */
  .filter-seg.active .filter-sizer { display: none; }
  /* Two chosen cells side by side keep a faint rule between them. */
  .filter-seg.active + .filter-seg.active { border-left-color: rgba(255, 255, 255, 0.4); }
  .filter-seg.active .filter-trigger,
  .filter-seg.active .filter-trigger:hover,
  .filter-seg.active .filter-trigger[aria-expanded="true"] { color: var(--warm-white); padding-right: 0.15rem; }

  .filter-clear {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem;
    margin-right: 0.55rem;
    border: none;
    border-radius: 0;
    background: none;
    color: var(--warm-white);
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }

  .filter-clear[hidden] { display: none; }
  .filter-clear:hover { color: var(--accent-soft); }

  .filter-trigger:focus-visible,
  .filter-clear:focus-visible,
  .filter-option:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .filter-seg.active .filter-trigger:focus-visible,
  .filter-seg.active .filter-clear:focus-visible { outline-color: var(--warm-white); }

  .filter-menu {
    position: absolute;
    top: calc(100% + 0.35rem);
    left: 0;
    z-index: 30;
    min-width: max(100%, 10rem);
    max-height: min(60vh, 22rem);
    overflow-y: auto;
    list-style: none;
    padding: 0.3rem;
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-sm);
    box-shadow: 0 4px 16px rgba(28, 24, 18, 0.12);
  }

  .filter-menu[hidden] { display: none; }

  /* Menus under the right-hand segments open leftwards so they stay on screen. */
  .filter-seg:nth-last-child(-n+2) .filter-menu { left: auto; right: 0; }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    min-height: 2.25rem;
    padding: 0.4rem 0.7rem;
    border: none;
    border-radius: 6px;
    background: none;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 0.82rem;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }

  .filter-option:hover,
  .filter-option:focus { background: var(--accent-soft); }

  .filter-option-check {
    flex-shrink: 0;
    width: 0.9rem;
    height: 0.9rem;
    color: var(--accent);
    visibility: hidden;
  }

  .filter-option[aria-checked="true"] { font-weight: 600; }
  .filter-option[aria-checked="true"] .filter-option-check { visibility: visible; }

  .results-count {
    font-family: var(--font-sans);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.25rem;
    text-align: center;
  }

  /* ── Recipe list ── */
  .recipe-list {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
  }

  .recipe-list-item {
    position: relative;
  }

  .recipe-card-btn {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    height: 100%;
    padding: 0;
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    cursor: pointer;
    text-align: left;
    color: var(--ink);
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .recipe-card-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 8px rgba(28, 24, 18, 0.06), 0 12px 24px rgba(28, 24, 18, 0.1);
  }

  .recipe-card-panel {
    position: relative;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--accent-soft);
  }

  .recipe-card-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .recipe-card-monogram {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 4rem;
    color: var(--ink);
    opacity: 0.22;
    line-height: 1;
  }

  .panel-chicken { background: #f1e2d3; }
  .panel-eggs { background: #f6ecc9; }
  .panel-pasta { background: #f3e6d6; }
  .panel-vegetarian { background: #dfe6d4; }
  .panel-pork { background: #f0d9cf; }
  .panel-potato { background: #e8dcc4; }
  .panel-beef { background: #e6d2ca; }
  .panel-seafood { background: #d9e2e2; }
  .panel-default { background: var(--accent-soft); }

  .recipe-card-text {
    display: flex;
    flex-direction: column;
    padding: 1rem 1.1rem 1.25rem;
    flex: 1;
  }

  .recipe-card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 600;
    display: block;
    margin-bottom: 0.35rem;
  }

  .recipe-card-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-bottom: 0.45rem;
  }

  .recipe-chip {
    font-family: var(--font-sans);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.15rem 0.55rem;
    border-radius: var(--radius-pill);
  }

  .recipe-chip.time { color: var(--accent); border-color: var(--accent); }

  .recipe-card-desc {
    font-size: 0.86rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    margin-top: auto;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .no-results {
    padding: 2rem 0;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    border-top: 1px solid var(--border);
    list-style: none;
    grid-column: 1 / -1;
  }

  .no-results-action {
    display: block;
    margin-top: 0.75rem;
    padding: 0.45rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--card-bg);
    color: var(--accent);
    font-family: var(--font-sans);
    font-size: 0.8rem;
    font-style: normal;
    font-weight: 500;
    cursor: pointer;
  }

  .no-results-action:hover { border-color: var(--accent); }
  .no-results-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Basket toggle (index card) ── */
  .basket-toggle {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    z-index: 2;
    flex-shrink: 0;
    width: 2.25rem;
    height: 2.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
  }

  .basket-toggle svg { width: 1.05rem; height: 1.05rem; }

  .basket-toggle:hover { color: var(--accent); }

  .basket-toggle.active {
    background: var(--accent);
    color: var(--warm-white);
  }

  /* ── Basket toggle (ingredients heading row) ── */
  .basket-toggle-large {
    flex-shrink: 0;
    white-space: nowrap;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.45rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius-pill);
    background: none;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
  }

  .basket-toggle-large.active {
    background: var(--accent);
    color: var(--warm-white);
  }

  /* ── Site nav ──
     One row of small uppercase links at the top of every page. The page
     you're on is marked with aria-current="page" and shown in ink with an
     accent underline. It isn't pinned, so the sticky filter bar and the
     recipe jump bar keep the top of the screen to themselves. */
  .site-nav {
    max-width: var(--reading-width);
    margin: 0 auto;
    padding: 1rem 2rem 0;
  }

  /* The list and the sliding indicator share this box, so the indicator
     can be positioned under whichever link is current. */
  .site-nav-inner {
    position: relative;
    width: fit-content;
    margin: 0 auto;
  }

  .site-nav-list {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 1.75rem;
  }

  .site-nav-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0;
    font-family: var(--font-sans);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    transition: color 0.15s;
  }

  .site-nav-link:hover { color: var(--accent); }
  .site-nav-link[aria-current="page"] { color: var(--ink); }
  .site-nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  /* One accent bar that slides under whichever link is current (set from
     JS in placeNavIndicator). It fades out on recipe pages, where nothing
     in the nav is the current page. */
  .nav-indicator {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 0;
    border-radius: 2px;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
  }
  .nav-indicator.is-ready {
    transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1), width 0.35s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s;
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-indicator.is-ready { transition: opacity 0.2s; }
  }

  .nav-back-arrow { font-size: 0.85rem; line-height: 1; }

  /* Number of recipes in the basket, as a small filled pill. */
  .nav-count {
    min-width: 1.15rem;
    padding: 0.1rem 0.35rem;
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: var(--warm-white);
    font-size: 0.62rem;
    letter-spacing: 0;
    line-height: 1.3;
    text-align: center;
  }
  /* Nothing in the list yet: a dulled-out 0, so the link keeps its shape. */
  .nav-count.is-empty { background: var(--border); color: var(--muted); }

  /* ── Back to top ──
     Takes the bottom-right corner once you've scrolled about a screen. */
  .back-to-top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 10;
    display: grid;
    place-items: center;
    width: 2.6rem;
    height: 2.6rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--card-bg);
    color: var(--muted);
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(28, 24, 18, 0.12);
    /* Hidden: below its spot and faded. It eases out quickly, and
       visibility flips only once it has gone, so it can't be tabbed to. */
    opacity: 0;
    visibility: hidden;
    transform: translateY(1.5rem);
    transition:
      transform 0.25s cubic-bezier(0.4, 0, 1, 1),
      opacity 0.2s cubic-bezier(0.4, 0, 1, 1),
      visibility 0s linear 0.25s,
      color 0.15s,
      border-color 0.15s;
  }
  .back-to-top svg { width: 1.1rem; height: 1.1rem; }
  /* Shown: slides up into place, easing in to land softly. */
  .back-to-top.is-visible {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition:
      transform 0.4s cubic-bezier(0.2, 0, 0, 1),
      opacity 0.3s cubic-bezier(0.2, 0, 0, 1),
      visibility 0s,
      color 0.15s,
      border-color 0.15s;
  }
  .back-to-top:hover { color: var(--accent); border-color: var(--accent); }
  .back-to-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .back-to-top, .back-to-top.is-visible { transform: none; }
  }

  /* ── Toast (e.g. "Shopping list cleared · Undo") ── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    z-index: 20;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 1rem;
    max-width: calc(100vw - 2rem);
    padding: 0.7rem 0.8rem 0.7rem 1.15rem;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--warm-white);
    font-family: var(--font-sans);
    font-size: 0.82rem;
    box-shadow: 0 4px 14px rgba(28, 24, 18, 0.25);
  }
  .toast[hidden] { display: none; }
  #toast-message { white-space: nowrap; }

  .toast-action {
    padding: 0.35rem 0.8rem;
    border: 1px solid currentColor;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--warm-white);
    font-family: var(--font-sans);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .toast-action:hover { background: var(--warm-white); color: var(--ink); }
  .toast-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Recipe view / Shopping list view ──
     A centred fixed-width reading column. */
  #recipe-view, #shopping-list-view {
    display: none;
    max-width: var(--reading-width);
    margin: 0 auto;
    padding: var(--page-top) 2rem 5rem;
  }

  /* The recipe illustration sits in the header, under the description and
     above the stats, with no frame: its paper tone is multiplied into the
     page and its edges fade out, so the sketch looks drawn on the page. */
  .recipe-hero {
    max-width: 30rem;
    margin: 0.5rem auto 0;
  }

  .recipe-hero img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 10;
    object-fit: contain;
    mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(ellipse 60% 62% at 50% 54%, #000 62%, transparent 100%);
    mask-image: radial-gradient(ellipse 60% 62% at 50% 54%, #000 62%, transparent 100%);
  }

  /* Same light masthead as the index: a small label, no heavy rules. */
  .recipe-header {
    margin-bottom: var(--space-section);
    text-align: center;
  }

  .recipe-label {
    font-family: var(--font-sans);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 0.75rem;
  }

  .recipe-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 600;
    line-height: 1.1;
  }

  .recipe-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  .recipe-description {
    max-width: 34rem;
    margin: 1rem auto 0;
    font-size: 1rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
  }

  .recipe-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    margin-top: 1.5rem;
    border: var(--card-border);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--card-bg);
    box-shadow: var(--shadow-card);
  }

  .recipe-stat {
    padding: 0.9rem 1.1rem;
    border-right: 1px solid var(--border);
  }

  .recipe-stat:last-child { border-right: none; }

  .stat-label {
    display: block;
    font-family: var(--font-sans);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }

  .stat-value {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
  }

  /* ── Recipe section jump bar ──
     Pinned to the top while scrolling a recipe; tapping a button scrolls to
     that section, and the section currently being read stays highlighted. */
  .recipe-jump {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    /* Bleed out over the view's side padding so the bar spans the screen. */
    /* The negative top margin and the bottom margin offset the bar's own
       padding (and its 1px rule), so the pill sits exactly one section gap
       from the header above and the first section below. */
    padding: 0.6rem 2rem;
    margin: -0.6rem -2rem calc(var(--space-section) - 0.6rem - 1px);
    background: var(--warm-white);
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .recipe-jump.is-stuck { border-bottom-color: var(--border); }

  .jump-group {
    display: inline-flex;
    padding: 0.2rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--card-bg);
  }

  .jump-btn {
    font-family: var(--font-sans);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.45rem 1.15rem;
    min-width: 7.5rem;
    border: none;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .jump-btn:hover { color: var(--accent); }

  .jump-btn[aria-current="true"] {
    background: var(--accent);
    color: var(--warm-white);
  }

  /* Leave room for the pinned bar when jumping to a section. */
  #recipe-ingredients, #recipe-method { scroll-margin-top: calc(3.4rem + var(--space-heading)); }

  section.recipe-section { margin-bottom: var(--space-section); }

  h2.section-heading {
    font-family: var(--font-sans);
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: var(--space-heading);
  }

  .section-heading-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: var(--space-heading);
  }

  .section-heading-row .section-heading {
    margin-bottom: 0;
  }

  /* Ingredients: a true grid (2 columns when the card is wide enough, 1 on
     phones). In 2 columns every row is the same height, so cells line up
     across the columns, and items still read top-to-bottom down the left
     column first (--rows is set from the item count in renderRecipe).
     Dividers run edge to edge: each cell has a bottom rule (the list's
     bottom 1px is clipped so the last row has none, leaving the card's own
     border), and left-column cells have a right rule. Amounts sit in their
     own right-aligned column so quantities line up for scanning. */
  .ingredients-card {
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    container-type: inline-size;
  }

  .ingredients-grid {
    display: grid;
    grid-template-columns: 1fr;
    list-style: none;
    clip-path: inset(0 0 1px 0);
  }

  @container (min-width: 36rem) {
    .ingredients-grid {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(var(--rows), 1fr);
      grid-auto-flow: column;
    }

    .ingredient.is-left-col { border-right: 1px solid var(--step-num); }
  }

  .ingredient {
    display: grid;
    grid-template-columns: 5.5rem 1fr;
    column-gap: 0.9rem;
    align-items: baseline;
    align-content: center;
    padding: 0.6rem 1.35rem;
    border-bottom: 1px solid var(--step-num);
    line-height: 1.35;
  }

  .ingredient-amount {
    font-family: var(--font-serif);
    font-weight: 600;
    color: var(--accent);
    font-size: 0.85rem;
    text-align: right;
    overflow-wrap: anywhere;
  }

  .ingredient-amount.is-vague {
    font-weight: 400;
    font-style: italic;
    color: var(--muted);
  }

  .ingredient-name {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.9rem;
  }

  .ingredient-prep {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
  }

  .steps {
    list-style: none;
  }

  /* Step number is a small filled badge on the title line; the step's text
     runs the full width of the card underneath instead of sitting beside a
     wide number column. */
  .step {
    margin-bottom: 1rem;
    padding: 1rem 1.35rem 1.1rem;
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    /* Clear the pinned jump bar when a step link scrolls to it. */
    scroll-margin-top: calc(3.4rem + var(--space-heading));
    transition: box-shadow 0.2s;
  }

  /* The step a #recipe/step-N link points at gets an accent ring, which
     also stands in for a focus outline when the link moves focus to it. */
  .step:focus { outline: none; }
  .step.is-target { box-shadow: 0 0 0 2px var(--accent), var(--shadow-card); }

  .step-head {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 0.35rem;
  }

  .step-number {
    flex-shrink: 0;
    width: 1.75rem;
    height: 1.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--warm-white);
    font-family: var(--font-sans);
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1;
    /* The badge is also the step's permalink (#recipe/step-N). */
    text-decoration: none;
  }

  /* The whole card is tappable (see the click handler by route()); the
     number stays the real link for keyboards and screen readers. */
  .step { cursor: pointer; }
  .step-number:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .step-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .step-content {
    font-size: 0.93rem;
    color: #3d3427;
    line-height: 1.65;
  }

  .step-timer {
    display: inline-block;
    margin-top: 0.4rem;
    font-family: var(--font-sans);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.15rem 0.6rem;
    border-radius: var(--radius-pill);
  }

  .notes-box {
    background: var(--cream);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    padding: 1.25rem 1.5rem;
    font-size: 0.88rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.7;
  }

  /* Light closing rule; the last section's own bottom gap sits above it. */
  .footer-rule {
    border: none;
    border-top: 1px solid var(--border);
  }

  /* ── Shopping list ── */
  .basket-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    justify-content: center;
  }

  .basket-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--font-sans);
    font-size: 0.78rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 0.25rem 0.4rem 0.25rem 0.7rem;
  }

  .basket-chip button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  .shopping-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem 1.25rem;
    margin-bottom: var(--space-section);
  }

  .whatsapp-btn,
  .empty-state-action {
    display: inline-block;
    background: var(--accent);
    color: var(--warm-white);
    border: none;
    border-radius: var(--radius-pill);
    padding: 0.7rem 1.4rem;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    text-decoration: none;
    line-height: 1.2;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .whatsapp-btn:hover,
  .empty-state-action:hover { opacity: 0.85; }
  .empty-state-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ── Empty shopping list ──
     Centred, with no rules around it: an icon, a short heading, a line
     showing the same + button you tap on a recipe, and a way back to the
     recipes. */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 24rem;
    margin: 0 auto;
    padding: 2.5rem 0 1rem;
  }

  .empty-state-icon {
    display: grid;
    place-items: center;
    width: 4rem;
    height: 4rem;
    margin-bottom: 1.25rem;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .empty-state-icon svg { width: 1.75rem; height: 1.75rem; }

  .empty-state-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 0.6rem;
  }

  .empty-state-text {
    font-family: var(--font-body);
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  /* A small copy of the + button from the recipe cards, so you know what to look for. */
  .empty-state-plus {
    display: inline-grid;
    place-items: center;
    width: 1.35rem;
    height: 1.35rem;
    margin: 0 0.1rem;
    vertical-align: -0.3rem;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .empty-state-plus svg { width: 0.8rem; height: 0.8rem; }

  /* Same shape as the WhatsApp button, outlined so WhatsApp stays the
     primary action. */
  .copy-list-btn {
    background: var(--card-bg);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius-pill);
    padding: calc(0.7rem - 1px) 1.4rem;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    line-height: 1.2;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .copy-list-btn:hover,
  .copy-list-btn.copied {
    background: var(--accent);
    color: var(--warm-white);
  }

  /* Sits at the end of the recipe chips, since it does the same job for
     all of them at once. Same size as a chip, but a plain text button so
     it reads as secondary. */
  .clear-list-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 0.78rem;
    text-decoration: underline;
    text-underline-offset: 0.2em;
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    transition: color 0.15s;
  }
  .clear-list-btn:hover { color: var(--accent); }
  .clear-list-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shopping-items { list-style: none; }

  .shopping-item {
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }

  .shopping-item-label {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    cursor: pointer;
  }

  .shopping-item-checkbox {
    appearance: none;
    -webkit-appearance: none;
    margin-top: 0.2rem;
    width: 1.15rem;
    height: 1.15rem;
    flex-shrink: 0;
    border: 1.5px solid var(--muted);
    border-radius: 3px;
    background: var(--warm-white);
    cursor: pointer;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }

  .shopping-item-checkbox:hover { border-color: var(--accent); }

  .shopping-item-checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .shopping-item-checkbox:checked::after {
    content: '';
    position: absolute;
    left: 0.36rem;
    top: 0.16rem;
    width: 0.3rem;
    height: 0.58rem;
    border: solid var(--warm-white);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .shopping-item-checkbox:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .shopping-item-main {
    display: flex;
    flex-direction: column;
  }

  .shopping-item-recipe {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    margin-top: 0.1rem;
  }

  .shopping-item.checked .shopping-item-name,
  .shopping-item.checked .shopping-item-recipe {
    text-decoration: line-through;
    color: var(--muted);
  }

  .all-checked-note {
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
  }

  /* ── View transitions: index ⇄ recipe ──
     Two beats:
     1. the page you're leaving fades out quickly, with a small drift;
     2. the page you're arriving at fades and drifts into place.
     The site nav stays put.
     Names are only applied while a transition is running (html[data-nav]),
     so they never affect normal layout. Browsers without view transitions,
     and anyone who prefers reduced motion, get an instant switch instead
     (see navigateWithTransition). */
  :root {
    --vt-total: 460ms;   /* whole transition */
    --vt-out: 180ms;     /* leaving page fades out */
    --vt-in-delay: 140ms;
    --vt-in: calc(var(--vt-total) - var(--vt-in-delay)); /* arriving page */
    --vt-ease-in: cubic-bezier(0.2, 0, 0, 1);
    --vt-ease-out: cubic-bezier(0.4, 0, 1, 1);
  }

  html[data-nav] #index { view-transition-name: index-view; }
  html[data-nav] #recipe-view { view-transition-name: recipe-view; }
  /* The recipe arrives over the list, so its snapshot needs to be opaque. */
  html[data-nav] #recipe-view { background: var(--warm-white); min-height: 100vh; }

  /* Only the named parts move; the page background stays put. */
  ::view-transition-old(root),
  ::view-transition-new(root) { animation: none; }
  ::view-transition-old(root) { display: none; }

  ::view-transition-group(recipe-view) { z-index: 2; }

  @keyframes vt-fade-out-down { to { opacity: 0; transform: translateY(0.75rem); } }
  @keyframes vt-fade-in-up { from { opacity: 0; transform: translateY(1.5rem); } }
  @keyframes vt-fade-in-down { from { opacity: 0; transform: translateY(-0.75rem); } }

  /* Opening a recipe */
  html[data-nav="forward"]::view-transition-old(index-view) {
    animation: var(--vt-out) var(--vt-ease-out) both vt-fade-out-down;
  }
  html[data-nav="forward"]::view-transition-new(recipe-view) {
    animation: var(--vt-in) var(--vt-ease-in) var(--vt-in-delay) both vt-fade-in-up;
  }

  /* Going back to the list */
  html[data-nav="back"]::view-transition-old(recipe-view) {
    animation: var(--vt-out) var(--vt-ease-out) both vt-fade-out-down;
  }
  html[data-nav="back"]::view-transition-new(index-view) {
    animation: var(--vt-in) var(--vt-ease-in) var(--vt-in-delay) both vt-fade-in-down;
  }

  @media (max-width: 500px) {
    .ingredient { grid-template-columns: 4.5rem 1fr; column-gap: 0.75rem; padding: 0.6rem 1rem; }
    .recipe-list { grid-template-columns: 1fr; }
    .recipe-stats { grid-template-columns: 1fr; }
    .recipe-stat { border-right: none; border-bottom: 1px solid var(--border); }
    .recipe-stat:last-child { border-bottom: none; }
    .back-to-top { right: 1rem; bottom: 1rem; }
    .toast { bottom: 1rem; }
    .site-nav { padding: 0.75rem 1rem 0; }
    .site-nav-list { gap: 1.25rem; }

    #index { padding: var(--page-top) 1rem 3rem; }
    .filter-shell { max-width: none; }

    :root { --space-section: 2rem; --space-heading: 1rem; --page-top: 1.25rem; }
    #recipe-view, #shopping-list-view { padding: var(--page-top) 1rem 3rem; }
    .recipe-jump { padding: 0.5rem 1rem; margin: -0.5rem -1rem calc(var(--space-section) - 0.5rem - 1px); }
    .filters { padding: 0.5rem 1rem; margin: -0.5rem -1rem 0.35rem; }
    .search-toggle, .search-close { width: 2.4rem; }
    .search-toggle svg, .search-close svg { width: 1.15rem; height: 1.15rem; }
    /* Five segments plus their padding don't fit a phone, so drop Veg (the
       narrowest category; search still finds those ingredients). If Veg was
       chosen on a wider screen it stays, so a filter is never applied
       without being shown. */
    .filter-seg[data-category="Veg"]:not(.active) { display: none; }
    .filter-trigger { padding: 0.5rem 0.55rem; font-size: 0.66rem; letter-spacing: 0.05em; }
    .filter-clear { width: 1.5rem; margin-right: 0.1rem; }
    .filter-seg.active .filter-trigger,
    .filter-seg.active .filter-trigger:hover,
    .filter-seg.active .filter-trigger[aria-expanded="true"] { padding-left: 0.55rem; padding-right: 0; }
    .filter-seg.active .filter-trigger-text { letter-spacing: 0; }
    /* Swap in the compact label (the full one stays in title / aria-label). */
    .filter-trigger-text[data-tiny] { font-size: 0; }
    .filter-trigger-text[data-tiny]::after { content: attr(data-tiny); font-size: 0.66rem; }
    .results-count { margin-bottom: 0.65rem; }
  }

  /* Below ~370px the category names no longer fit side by side, so let the
     segments share the bar and truncate rather than overflow it. */
  @media (max-width: 370px) {
    .filter-seg, .filter-label { min-width: 0; }
    .filter-label { grid-template-columns: minmax(0, 1fr); }
    .filter-sizer { overflow: hidden; }
    .filter-trigger { padding-left: 0.3rem; padding-right: 0.3rem; font-size: 0.62rem; letter-spacing: 0.02em; }
    .filter-seg.active .filter-trigger,
    .filter-seg.active .filter-trigger:hover,
    .filter-seg.active .filter-trigger[aria-expanded="true"] { padding-left: 0.4rem; }
    .filter-clear { margin-right: 0; }
    .filter-trigger-text[data-tiny]::after { font-size: 0.62rem; }
  }
</style>
</head>
<body>

<nav class="site-nav" aria-label="Site">
  <div class="site-nav-inner">
    <ul class="site-nav-list">
      <li><a class="site-nav-link" id="nav-recipes" href="#" onclick="event.preventDefault(); showIndex()">Recipes</a></li>
      <li><a class="site-nav-link" id="shopping-list-link" href="#shopping-list">Shopping list <span class="nav-count is-empty" id="nav-count">0</span><span class="visually-hidden" id="nav-count-unit"> recipes</span></a></li>
    </ul>
    <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
  </div>
</nav>

<main>

<div id="index">
  <!-- No visible title (the nav says where you are), but kept for screen
       readers and as the place focus lands when you arrive on the page. -->
  <h1 class="visually-hidden" id="site-title" tabindex="-1">Recipes</h1>

  <div class="filters">
    <div class="filter-shell">
      <button type="button" class="search-toggle" id="search-toggle" aria-label="Search recipes" aria-expanded="false" aria-controls="search-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter recipes"></div>
      <div class="search-panel" id="search-panel" role="search" inert>
        <label class="visually-hidden" for="recipe-search">Search recipes</label>
        <input type="search" id="recipe-search" class="search-input" placeholder="Search, e.g. lentil, salmon" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="search-close" id="search-close" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <p class="results-count" id="results-count" aria-live="polite"></p>
  <ul class="recipe-list" id="recipe-list"></ul>
</div>

<div id="recipe-view">
  <div id="recipe-content"></div>
</div>

<div id="shopping-list-view">
  <div id="shopping-list-content"></div>
</div>

</main>

<button id="back-to-top" class="back-to-top" aria-label="Back to top" onclick="backToTop()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>

<!-- Always in the page so screen readers reliably announce what's put in it. -->
<p id="live-status" class="visually-hidden" role="status"></p>

<div id="toast" class="toast" hidden>
  <span id="toast-message"></span>
  <button id="toast-action" class="toast-action" type="button"></button>
</div>

<script>
// ─────────────────────────────────────────────
//  RECIPE DATA — GENERATED, DO NOT EDIT BY HAND
//
//  Source of truth is recipes/*.yaml + ingredients.yaml. Edit those,
//  then run `npm run build` to regenerate the block below.
//  Shape per recipe: see any file in recipes/ for the fields
//  (id, title, titleHtml, label, servings, time, timeMins, cookedIn,
//  description, tags, ingredients, steps, notes).
// ─────────────────────────────────────────────

// GENERATED:RECIPES:START

const recipes = []; // placeholder — real data injected by `npm run build` into build/index.html
// GENERATED:RECIPES:END

// ─────────────────────────────────────────────
//  SHOPPING BASKET
//
//  Each ingredient's `section` is precomputed at build time from
//  ingredients.yaml (see scripts/build.mjs) — no runtime guessing.
// ─────────────────────────────────────────────

// Recipe text is inserted with innerHTML, so every value from the recipe
// data goes through esc() first and renders as plain text. The one
// exception is `titleHtml`, which the build has already checked contains
// nothing but <em>/<strong> (see scripts/validate.mjs).
const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ESCAPES[ch]);

const SECTION_ORDER = ["Fruit & Veg", "Meat & Fish", "Deli & Dairy", "Dry Goods & Spices", "Tinned & Jarred", "Bread & Bakery", "Other"];

function loadBasket() {
  try {
    return new Set(JSON.parse(localStorage.getItem('recipeBasket')) || []);
  } catch {
    return new Set();
  }
}

function saveBasket() {
  try {
    localStorage.setItem('recipeBasket', JSON.stringify([...basket]));
  } catch {}
}

let basket = loadBasket();

function loadCheckedItems() {
  try {
    return new Set(JSON.parse(localStorage.getItem('shoppingChecked')) || []);
  } catch {
    return new Set();
  }
}

function saveCheckedItems() {
  try {
    localStorage.setItem('shoppingChecked', JSON.stringify([...checkedItems]));
  } catch {}
}

let checkedItems = loadCheckedItems();

function toggleChecked(name) {
  checkedItems.has(name) ? checkedItems.delete(name) : checkedItems.add(name);
  saveCheckedItems();
  renderShoppingListContent();
}

// Updates the toggle buttons for this recipe in place (index card and
// recipe page) rather than re-rendering the view, so scroll position,
// keyboard focus and any step highlight stay exactly where they were.
// The new state is conveyed by aria-pressed on the focused button.
function toggleBasket(id) {
  basket.has(id) ? basket.delete(id) : basket.add(id);
  saveBasket();
  renderBasketBadge();
  updateBasketToggles(id);
}

function updateBasketToggles(id) {
  const inBasket = basket.has(id);
  document.querySelectorAll(`[data-basket-id="${CSS.escape(id)}"]`).forEach(btn => {
    btn.classList.toggle('active', inBasket);
    btn.setAttribute('aria-pressed', String(inBasket));
    if (btn.classList.contains('basket-toggle-large')) {
      btn.textContent = basketLargeLabel(inBasket);
    } else {
      btn.setAttribute('aria-label', inBasket ? 'Remove from shopping list' : 'Add to shopping list');
      btn.innerHTML = inBasket ? CHECK_ICON : PLUS_ICON;
    }
  });
}

const basketLargeLabel = inBasket => inBasket ? '✓ In shopping list' : '+ Add to shopping list';

function removeFromBasket(id) {
  basket.delete(id);
  saveBasket();
  renderBasketBadge();
  renderShoppingListContent();
}

// Clears straight away, then offers Undo for a few seconds rather than
// asking "are you sure?" first. Focus moves to Undo, since the button you
// pressed is gone once the list is empty.
function clearBasket() {
  const previous = { basket: [...basket], checked: [...checkedItems] };
  basket.clear();
  checkedItems.clear();
  saveBasket();
  saveCheckedItems();
  renderBasketBadge();
  renderShoppingListContent();
  showToast('Shopping list cleared', 'Undo', () => {
    previous.basket.forEach(id => basket.add(id));
    previous.checked.forEach(name => checkedItems.add(name));
    saveBasket();
    saveCheckedItems();
    renderBasketBadge();
    renderShoppingListContent();
    announce('Shopping list restored');
    document.getElementById('shopping-list-title')?.focus({ preventScroll: true });
  });
}

// Keeps the recipe count in the nav's Shopping list link up to date.
function renderBasketBadge() {
  const count = document.getElementById('nav-count');
  count.classList.toggle('is-empty', basket.size === 0);
  count.textContent = basket.size;
  // Read out as "Shopping list 2 recipes", keeping the visible text first.
  document.getElementById('nav-count-unit').textContent = basket.size === 1 ? ' recipe' : ' recipes';
  placeNavIndicator(); // the count's width can change
}

// ─────────────────────────────────────────────
//  TOAST & ANNOUNCEMENTS
// ─────────────────────────────────────────────

function announce(text) {
  const live = document.getElementById('live-status');
  live.textContent = '';
  // A fresh change on the next frame, so repeating the same text is still read out.
  requestAnimationFrame(() => { live.textContent = text; });
}

const TOAST_MS = 6000;
let toastTimer = null;

function showToast(message, actionLabel, onAction) {
  const toast = document.getElementById('toast');
  const action = document.getElementById('toast-action');
  document.getElementById('toast-message').textContent = message;
  action.textContent = actionLabel;
  action.onclick = () => { hideToast(false); onAction(); };
  toast.hidden = false;
  updateBackToTop();
  announce(`${message}. ${actionLabel} button available.`);
  action.focus();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => hideToast(true), TOAST_MS);
}

// When the toast times out while its button has focus, hand focus to the
// page heading so it isn't lost.
function hideToast(returnFocus) {
  clearTimeout(toastTimer);
  const toast = document.getElementById('toast');
  const hadFocus = toast.contains(document.activeElement);
  toast.hidden = true;
  updateBackToTop();
  if (returnFocus && hadFocus) currentHeading()?.focus({ preventScroll: true });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('toast').hidden) hideToast(true);
});

// Ingredients with the same name (across recipes, or repeated within one)
// are combined into a single line listing every recipe that needs it —
// no amount shown, since amounts from different recipes aren't merged.
function buildShoppingList() {
  const grouped = new Map();
  basket.forEach(id => {
    const r = recipes.find(x => x.id === id);
    if (!r) return;
    r.ingredients.forEach(ing => {
      const section = ing.section;
      if (!grouped.has(section)) grouped.set(section, new Map());
      const bySection = grouped.get(section);
      if (!bySection.has(ing.name)) {
        bySection.set(ing.name, { name: ing.name, recipeTitles: [] });
      }
      const item = bySection.get(ing.name);
      if (!item.recipeTitles.includes(r.title)) item.recipeTitles.push(r.title);
    });
  });

  // Drop any checked state for items no longer in the list (e.g. after
  // removing a recipe) so it doesn't linger in storage indefinitely.
  const presentNames = new Set();
  grouped.forEach(bySection => bySection.forEach(item => presentNames.add(item.name)));
  let checkedChanged = false;
  checkedItems.forEach(name => {
    if (!presentNames.has(name)) { checkedItems.delete(name); checkedChanged = true; }
  });
  if (checkedChanged) saveCheckedItems();

  return SECTION_ORDER
    .filter(section => grouped.has(section))
    .map(section => ({ section, items: [...grouped.get(section).values()] }));
}

// Plain-text list shared by "Send to WhatsApp" and "Copy list": the basket's
// recipes under the title, then unchecked ingredients by section (names
// only — which recipe needs what is shown in the app, not the message).
function buildShoppingListText(groups) {
  const recipeTitles = [...basket].map(id => recipes.find(r => r.id === id)).filter(Boolean).map(r => r.title);
  const lines = ['Shopping List', ''];
  if (recipeTitles.length) {
    lines.push('RECIPES');
    recipeTitles.forEach(title => lines.push(`- ${title}`));
    lines.push('');
  }
  groups.forEach(({ section, items }) => {
    const unchecked = items.filter(item => !checkedItems.has(item.name));
    if (unchecked.length === 0) return;
    lines.push(section.toUpperCase());
    unchecked.forEach(item => lines.push(`- ${item.name}`));
    lines.push('');
  });
  return lines.join('\n').trim();
}

// Copies the same text the WhatsApp button sends (unchecked items only) —
// for devices without WhatsApp, e.g. an iPad. Falls back to a hidden
// textarea + execCommand where the async Clipboard API isn't available.
async function copyShoppingList(btn) {
  const text = buildShoppingListText(buildShoppingList());
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
  }
  btn.textContent = ok ? '✓ Copied' : 'Copy failed';
  btn.classList.toggle('copied', ok);
  clearTimeout(btn._resetTimer);
  btn._resetTimer = setTimeout(() => {
    btn.textContent = 'Copy list';
    btn.classList.remove('copied');
  }, 2000);
}

function buildWhatsAppUrl(groups) {
  const text = buildShoppingListText(groups);
  return `https://wa.me/?text=${encodeURIComponent(text)}`;
}

// ─────────────────────────────────────────────
//  FILTER STATE & LOGIC
// ─────────────────────────────────────────────

const TIME_BANDS = [
  // `short` is shown on the filter button once chosen; `tiny` replaces it on
  // phones, where the Time segment only has room for a few characters.
  { label: "Under 30 min", short: "< 30 min",  tiny: "< 30",  key: "under30", test: m => m < 30 },
  { label: "30–60 min",    short: "30–60 min", tiny: "30–60", key: "30to60",  test: m => m >= 30 && m <= 60 },
  { label: "Over 1 hr",    short: "1 hr +",    tiny: "1 hr+", key: "over60",  test: m => m > 60 },
];

// Groups tags by the role they play in a meal — closer to how you'd
// actually plan one ("what's my protein, what's my carb, what veg") than a
// strict ingredient taxonomy — plus a "Dish" group for the kind of dish it
// is (curry, stew, bake…), so each group gets its own filter dropdown. Unknown tags fall into "Other".
const TAG_CATEGORIES = {
  bacon: "Protein", beef: "Protein", chicken: "Protein", lamb: "Protein", pork: "Protein", turkey: "Protein", gammon: "Protein",
  prawns: "Protein", seafood: "Protein", salmon: "Protein", tuna: "Protein", cod: "Protein", mussels: "Protein",
  eggs: "Protein", chickpeas: "Protein",
  potato: "Carbs", pasta: "Carbs", rice: "Carbs", noodles: "Carbs", dumplings: "Carbs",
  aubergine: "Veg", cabbage: "Veg", carrot: "Veg", vegetarian: "Veg", cucumber: "Veg", courgette: "Veg", mushroom: "Veg", spinach: "Veg", tomato: "Veg",
  curry: "Dish", stew: "Dish", soup: "Dish", roast: "Dish", bake: "Dish", fried: "Dish", sticky: "Dish",
  "stir-fry": "Dish", salad: "Dish", omelette: "Dish", pancakes: "Dish", sandwich: "Dish",
};
const CATEGORY_ORDER = ["Protein", "Carbs", "Veg", "Dish", "Other"];

// One active choice per category, keyed by category name, e.g.
// { Protein: "chicken", Time: "under30" }. Choices in different categories
// combine (AND); choosing again in the same category replaces the old choice.
const activeFilters = {};

const OPTION_CHECK_ICON = '<svg class="filter-option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function getAllTags() {
  const tags = new Set();
  recipes.forEach(r => r.tags.forEach(t => tags.add(t)));
  return [...tags].sort();
}

function getTagsByCategory() {
  const groups = new Map();
  getAllTags().forEach(tag => {
    const category = TAG_CATEGORIES[tag] || "Other";
    if (!groups.has(category)) groups.set(category, []);
    groups.get(category).push(tag);
  });
  return CATEGORY_ORDER
    .filter(category => groups.has(category))
    .map(category => ({ category, tags: groups.get(category) }));
}

function getTimeBandsPresent() {
  return TIME_BANDS.filter(band => recipes.some(r => band.test(r.timeMins)));
}

// ── Text search ──
// Matches title, description, tags and ingredient names, ignoring case and
// accents. Every word typed has to appear somewhere ("chicken curry" finds
// recipes with both).
//
// Search and the dropdown filters are either/or: search opens in place of
// the filters, so while it's open the (hidden) filters are paused and you
// search every recipe. Closing search clears the query and brings the
// filters back exactly as they were.
let searchQuery = '';
let searchOpen = false;

const normalise = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

const searchText = new Map(recipes.map(r => [r.id, normalise([
  r.title, r.description, ...r.tags, ...r.ingredients.map(i => i.name),
].join(' '))]));

function matchesSearch(r) {
  const words = normalise(searchQuery).split(/\s+/).filter(Boolean);
  const text = searchText.get(r.id) ?? '';
  return words.every(w => text.includes(w));
}

function filteredRecipes() {
  if (searchOpen) return recipes.filter(matchesSearch);
  return recipes.filter(r => Object.entries(activeFilters).every(([category, value]) =>
    category === "Time"
      ? TIME_BANDS.find(b => b.key === value)?.test(r.timeMins)
      : r.tags.includes(value)
  ));
}

function initSearch() {
  const input = document.getElementById('recipe-search');
  const toggle = document.getElementById('search-toggle');
  let timer = null;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      // Nothing to do if the words haven't changed (e.g. a trailing space),
      // so the list doesn't re-render or move under you.
      if (!searchOpen || input.value.trim() === searchQuery) return;
      searchQuery = input.value.trim();
      renderList();
      scrollToResultsIfStuck();
    }, 150);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
  });
  toggle.addEventListener('click', () => searchOpen ? closeSearch() : openSearch());
  document.getElementById('search-close').addEventListener('click', () => closeSearch());
  // "/" opens search from anywhere on the index, unless you're already
  // typing somewhere. Tab and Shift+Tab still leave the field as normal.
  document.addEventListener('keydown', e => {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || currentView() !== 'index') return;
    const el = document.activeElement;
    if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
    e.preventDefault();
    openSearch();
  });
}

// Swaps the filters for the search field (or back). The CSS fades between
// them and hides whichever is off once its fade ends; inert takes it out of
// the tab order and accessibility tree straight away.
function setSearchOpen(open) {
  searchOpen = open;
  if (openSeg) closeMenu(openSeg);
  document.querySelector('.filters').classList.toggle('is-searching', open);
  document.getElementById('search-toggle').setAttribute('aria-expanded', String(open));
  document.getElementById('search-panel').inert = !open;
  document.getElementById('filter-bar').inert = open;
}

function openSearch() {
  if (!searchOpen) {
    setSearchOpen(true);
    renderList();
  }
  document.getElementById('recipe-search').focus();
}

// Closing clears the query, so the filters and an invisible search never
// combine. Focus goes back to the search button.
function closeSearch() {
  const input = document.getElementById('recipe-search');
  input.value = '';
  searchQuery = '';
  setSearchOpen(false);
  renderList();
  scrollToResultsIfStuck();
  document.getElementById('search-toggle').focus();
}

// The no-results "Clear search" action.
function clearSearch() {
  closeSearch();
}

const capitalise = s => s.charAt(0).toUpperCase() + s.slice(1);

// Each dropdown's options: [{ value, label }]. Built once in buildFilters().
let filterCategories = [];

function buildFilters() {
  filterCategories = [
    ...getTagsByCategory().map(({ category, tags }) => ({
      category,
      options: tags.map(tag => ({ value: tag, label: capitalise(tag) })),
    })),
    { category: "Time", options: getTimeBandsPresent().map(b => ({ value: b.key, label: b.label, short: b.short, tiny: b.tiny })) },
  ];

  document.getElementById('filter-bar').innerHTML = filterCategories.map(({ category, options }) => {
    const slug = category.toLowerCase();
    const items = [{ value: "", label: "All" }, ...options].map(o => `
      <li role="none"><button type="button" class="filter-option" role="menuitemradio" tabindex="-1"
        data-value="${esc(o.value)}" aria-checked="false">${OPTION_CHECK_ICON}<span>${esc(o.label)}</span></button></li>
    `).join('');
    return `
      <div class="filter-seg" data-category="${category}">
        <button type="button" class="filter-trigger" id="filter-trigger-${slug}"
          aria-haspopup="menu" aria-expanded="false" aria-controls="filter-menu-${slug}">
          <span class="filter-label"><span class="filter-sizer" aria-hidden="true">${category}</span><span class="filter-trigger-text">${category}</span></span>
        </button>
        <button type="button" class="filter-clear" hidden>×</button>
        <ul class="filter-menu" id="filter-menu-${slug}" role="menu" aria-labelledby="filter-trigger-${slug}" hidden>${items}</ul>
      </div>
    `;
  }).join('');

  initFilterEvents();
  updateFilterUI();
}

function setFilter(category, value) {
  if (value) activeFilters[category] = value;
  else delete activeFilters[category];
  updateFilterUI();
  renderList();
  scrollToResultsIfStuck();
}

// If you're scrolled down the list when you change a filter or search, jump
// back to the top of the new results rather than leaving you partway down.
function scrollToResultsIfStuck() {
  const filters = document.querySelector('.filters');
  // The is-stuck class only refreshes on the next animation frame after a
  // scroll, so recheck it now rather than trusting a stale value.
  updateFilterBarStuck();
  if (filters.classList.contains('is-stuck')) {
    const count = document.getElementById('results-count');
    window.scrollTo(0, count.getBoundingClientRect().top + window.scrollY - filters.offsetHeight);
  }
}

function updateFilterBarStuck() {
  const filters = document.querySelector('.filters');
  if (document.getElementById('index').style.display === 'none') return;
  filters.classList.toggle('is-stuck', filters.getBoundingClientRect().top <= 0 && window.scrollY > 0);
}

function updateFilterUI() {
  document.querySelectorAll('.filter-seg').forEach(seg => {
    const { category } = seg.dataset;
    const value = activeFilters[category];
    const option = value && filterCategories.find(c => c.category === category)?.options.find(o => o.value === value);
    const trigger = seg.querySelector('.filter-trigger');
    const clear = seg.querySelector('.filter-clear');

    seg.classList.toggle('active', Boolean(option));
    const shown = option ? (option.short || option.label) : category;
    const text = trigger.querySelector('.filter-trigger-text');
    text.textContent = shown;
    if (option?.tiny) text.dataset.tiny = option.tiny;
    else delete text.dataset.tiny;
    // The visible text is just the choice ("Chicken"); the accessible name
    // keeps the category in front of it so it still makes sense when read out.
    if (option) {
      // Keep the visible text in the accessible name (WCAG 2.5.3).
      trigger.setAttribute('aria-label', `${category}: ${shown}`);
      trigger.title = `${category}: ${option.label}`;
    } else {
      trigger.removeAttribute('aria-label');
      trigger.removeAttribute('title');
    }
    clear.hidden = !option;
    clear.setAttribute('aria-label', option ? `Clear ${category} filter (${option.label})` : `Clear ${category} filter`);

    seg.querySelectorAll('.filter-option').forEach(btn => {
      btn.setAttribute('aria-checked', String(btn.dataset.value === (value || "")));
    });
  });
}

// ── Dropdown behaviour (menu button pattern) ──
// Enter, Space or ↓ on a button opens its menu with the current choice
// focused (↑ focuses the last option). Inside the menu: ↑/↓ move and wrap,
// Home/End jump, typing a letter jumps to the next option starting with it,
// Enter/Space choose, Esc closes back to the button, and Tab closes and moves on.

let openSeg = null;

function menuOptions(seg) {
  return [...seg.querySelectorAll('.filter-option')];
}

function openMenu(seg, focus = 'checked') {
  if (openSeg && openSeg !== seg) closeMenu(openSeg);
  const trigger = seg.querySelector('.filter-trigger');
  const menu = seg.querySelector('.filter-menu');
  menu.hidden = false;
  trigger.setAttribute('aria-expanded', 'true');
  openSeg = seg;
  const options = menuOptions(seg);
  const target = focus === 'last'
    ? options[options.length - 1]
    : options.find(o => o.getAttribute('aria-checked') === 'true') || options[0];
  target.focus();
}

function closeMenu(seg, { returnFocus = false } = {}) {
  seg.querySelector('.filter-menu').hidden = true;
  seg.querySelector('.filter-trigger').setAttribute('aria-expanded', 'false');
  if (openSeg === seg) openSeg = null;
  if (returnFocus) seg.querySelector('.filter-trigger').focus();
}

function initFilterEvents() {
  const bar = document.getElementById('filter-bar');

  bar.addEventListener('click', e => {
    const seg = e.target.closest('.filter-seg');
    if (!seg) return;
    const { category } = seg.dataset;

    if (e.target.closest('.filter-trigger')) {
      if (openSeg === seg) closeMenu(seg);
      else openMenu(seg);
    } else if (e.target.closest('.filter-clear')) {
      setFilter(category, null);
      seg.querySelector('.filter-trigger').focus();
    } else if (e.target.closest('.filter-option')) {
      setFilter(category, e.target.closest('.filter-option').dataset.value);
      closeMenu(seg, { returnFocus: true });
    }
  });

  bar.addEventListener('keydown', e => {
    const seg = e.target.closest('.filter-seg');
    if (!seg) return;

    if (e.target.classList.contains('filter-trigger')) {
      if (e.key === 'ArrowDown') { e.preventDefault(); openMenu(seg); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); openMenu(seg, 'last'); }
      return;
    }

    if (!e.target.classList.contains('filter-option')) return;
    const options = menuOptions(seg);
    const i = options.indexOf(e.target);
    const move = j => { e.preventDefault(); options[(j + options.length) % options.length].focus(); };

    switch (e.key) {
      case 'ArrowDown': move(i + 1); break;
      case 'ArrowUp': move(i - 1); break;
      case 'Home': move(0); break;
      case 'End': move(options.length - 1); break;
      case 'Escape': e.preventDefault(); closeMenu(seg, { returnFocus: true }); break;
      case 'Tab': closeMenu(seg); break;
      default:
        if (e.key.length === 1 && /\S/.test(e.key)) {
          const key = e.key.toLowerCase();
          const order = [...options.slice(i + 1), ...options.slice(0, i + 1)];
          const match = order.find(o => o.textContent.trim().toLowerCase().startsWith(key));
          if (match) { e.preventDefault(); match.focus(); }
        }
    }
  });

  // Click or tap anywhere outside the open menu closes it.
  document.addEventListener('click', e => {
    if (openSeg && !openSeg.contains(e.target)) closeMenu(openSeg);
  });

  // Focus leaving the open dropdown by any other route also closes it.
  bar.addEventListener('focusout', e => {
    if (openSeg && e.relatedTarget && !openSeg.contains(e.relatedTarget)) closeMenu(openSeg);
  });
}

// ─────────────────────────────────────────────
//  RENDERING
// ─────────────────────────────────────────────

// Homepage cards with no photo yet fall back to a tag-colored panel with
// a large monogram — a typographic stand-in, never a fake photo.
const PANEL_TAGS = ['chicken', 'eggs', 'pasta', 'vegetarian', 'pork', 'potato', 'beef', 'seafood'];

function tagPanelClass(tags) {
  const match = tags.find(t => PANEL_TAGS.includes(t));
  return match ? `panel-${match}` : 'panel-default';
}

const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
const BASKET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1.5 10a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7Z"/><path d="m9 9 3-5 3 5"/><path d="M10 13v4M14 13v4"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function renderList() {
  const list = document.getElementById('recipe-list');
  const count = document.getElementById('results-count');
  const results = filteredRecipes();

  count.textContent = `${results.length} recipe${results.length !== 1 ? 's' : ''}`;

  if (results.length === 0) {
    list.innerHTML = searchQuery
      ? `<li class="no-results">No recipes match “${esc(searchQuery)}”.
          <button type="button" class="no-results-action" onclick="clearSearch()">Clear search</button></li>`
      : '<li class="no-results">No recipes match those filters.</li>';
    return;
  }

  list.innerHTML = results.map(r => {
    const tagChips = r.tags.map(t => `<span class="recipe-chip">${esc(t)}</span>`).join('');
    const timeBand = TIME_BANDS.find(b => b.test(r.timeMins));
    const timeChip = timeBand ? `<span class="recipe-chip time">${esc(r.time)}</span>` : '';
    const inBasket = basket.has(r.id);
    const panel = r.image
      ? `<img class="recipe-card-photo" src="images/${esc(r.image)}" alt="" loading="lazy">`
      : `<span class="recipe-card-monogram">${esc(r.title.charAt(0))}</span>`;
    return `
      <li class="recipe-list-item">
        <button class="recipe-card-btn" onclick="showRecipe('${r.id}')">
          <div class="recipe-card-panel ${tagPanelClass(r.tags)}">${panel}</div>
          <div class="recipe-card-text">
            <span class="recipe-card-title">${esc(r.title)}</span>
            <div class="recipe-card-chips">${tagChips}${timeChip}</div>
            <span class="recipe-card-desc">${esc(r.description)}</span>
          </div>
        </button>
        <button class="basket-toggle${inBasket ? ' active' : ''}" data-basket-id="${esc(r.id)}" aria-pressed="${inBasket}" aria-label="${inBasket ? 'Remove from shopping list' : 'Add to shopping list'}" onclick="toggleBasket('${r.id}')">${inBasket ? CHECK_ICON : PLUS_ICON}</button>
      </li>
    `;
  }).join('');
}

function renderRecipe(r) {
  // Amounts that aren't a measurement ("to taste", "as needed", "a squeeze")
  // get a quieter style so the real quantities stand out down the column.
  // In the 2-column layout the left column holds the first half (rounded up).
  const ingredientRows = Math.ceil(r.ingredients.length / 2);
  const ingredientsHtml = r.ingredients.map((ing, i) => {
    const amount = ing.amount || '';
    const vague = amount && !/\d|[½⅓¼¾⅔]/.test(amount);
    return `
    <li class="ingredient${i < ingredientRows ? ' is-left-col' : ''}">
      <span class="ingredient-amount${vague ? ' is-vague' : ''}">${esc(amount)}</span>
      <span class="ingredient-text">
        <span class="ingredient-name">${esc(ing.name)}</span>
        ${ing.prep ? `<span class="ingredient-prep">${esc(ing.prep)}</span>` : ''}
      </span>
    </li>
  `;
  }).join('');

  // Each step number links to #<recipe>/step-N, so a step can be shared or
  // bookmarked; see route().
  const stepsHtml = r.steps.map((step, i) => `
    <li class="step" id="step-${i + 1}" tabindex="-1">
      <div class="step-head">
        <a class="step-number" href="#${r.id}/step-${i + 1}" aria-label="Link to step ${i + 1}">${i + 1}</a>
        <div class="step-title">${esc(step.title)}</div>
      </div>
      <div class="step-content">${esc(step.content)}</div>
      ${step.timer ? `<span class="step-timer">${esc(step.timer)}</span>` : ''}
    </li>
  `).join('');

  const inBasket = basket.has(r.id);

  const heroHtml = r.image
    ? `<div class="recipe-hero"><img src="images/${esc(r.image)}" alt="${esc(r.title)}"></div>`
    : '';

  const stats = [
    { label: 'Time', value: r.time },
    { label: 'Servings', value: r.servings },
    { label: 'Cooked in', value: r.cookedIn }
  ];
  const statsHtml = stats.map(s => `
    <div class="recipe-stat">
      <span class="stat-label">${esc(s.label)}</span>
      <span class="stat-value">${esc(s.value)}</span>
    </div>
  `).join('');

  document.getElementById('recipe-content').innerHTML = `
    <header class="recipe-header">
      <p class="recipe-label">${esc(r.label)} — serves ${esc(r.servings)}</p>
      <h1 class="recipe-title" id="recipe-title" tabindex="-1">${r.titleHtml}</h1>
      <p class="recipe-description">${esc(r.description)}</p>
      ${heroHtml}
      <div class="recipe-stats">${statsHtml}</div>
    </header>

    <nav class="recipe-jump" id="recipe-jump" aria-label="Recipe sections">
      <div class="jump-group">
        <button class="jump-btn" data-target="recipe-ingredients" aria-current="true" onclick="jumpToSection('recipe-ingredients')">Ingredients</button>
        <button class="jump-btn" data-target="recipe-method" aria-current="false" onclick="jumpToSection('recipe-method')">Method</button>
      </div>
    </nav>

    <section class="recipe-section" id="recipe-ingredients">
      <div class="section-heading-row">
        <h2 class="section-heading">Ingredients</h2>
        <button class="basket-toggle-large${inBasket ? ' active' : ''}" data-basket-id="${esc(r.id)}" aria-pressed="${inBasket}" onclick="toggleBasket('${r.id}')">${basketLargeLabel(inBasket)}</button>
      </div>
      <div class="ingredients-card"><ul class="ingredients-grid" style="--rows: ${ingredientRows}">${ingredientsHtml}</ul></div>
    </section>

    <section class="recipe-section" id="recipe-method">
      <h2 class="section-heading">Method</h2>
      <ol class="steps">${stepsHtml}</ol>
    </section>

    <section class="recipe-section">
      <h2 class="section-heading">Notes</h2>
      <div class="notes-box">${esc(r.notes)}</div>
    </section>

    <hr class="footer-rule">
  `;

  renderedRecipeId = r.id;
  showView('recipe');
  document.title = `${r.title} – My Recipes`;
  window.scrollTo(0, takeRestoreScroll());
  document.getElementById('recipe-title').focus({ preventScroll: true });
  updateJumpBar();
}

// ─────────────────────────────────────────────
//  RECIPE JUMP BAR — Ingredients | Method
// ─────────────────────────────────────────────

// While a tap-triggered smooth scroll is in flight, keep the tapped button
// highlighted rather than flickering through the sections it passes.
let jumpLockTimer = null;
let jumpLocked = false;

function jumpToSection(id) {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setActiveJump(id);
  jumpLocked = true;
  document.getElementById(id).scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  releaseJumpLockSoon();
}

// Released once scrolling has been quiet briefly (works in browsers without
// a `scrollend` event too).
function releaseJumpLockSoon() {
  clearTimeout(jumpLockTimer);
  jumpLockTimer = setTimeout(() => { jumpLocked = false; updateJumpBar(); }, 150);
}

function setActiveJump(id) {
  document.querySelectorAll('.jump-btn').forEach(btn => {
    btn.setAttribute('aria-current', btn.dataset.target === id ? 'true' : 'false');
  });
}

// Highlights "Method" once its section reaches the bar (or the page can't
// scroll any further), otherwise "Ingredients".
function updateJumpBar() {
  const bar = document.getElementById('recipe-jump');
  const method = document.getElementById('recipe-method');
  if (!bar || !method || document.getElementById('recipe-view').style.display === 'none') return;
  const barBottom = bar.getBoundingClientRect().bottom;
  bar.classList.toggle('is-stuck', bar.getBoundingClientRect().top <= 0 && window.scrollY > 0);
  if (jumpLocked) return;
  const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  setActiveJump(method.getBoundingClientRect().top <= barBottom + 24 || atBottom ? 'recipe-method' : 'recipe-ingredients');
}

let jumpBarFrame = null;
window.addEventListener('scroll', () => {
  if (jumpLocked) releaseJumpLockSoon();
  if (jumpBarFrame) return;
  jumpBarFrame = requestAnimationFrame(() => { jumpBarFrame = null; updateJumpBar(); updateFilterBarStuck(); updateBackToTop(); });
}, { passive: true });

function renderIndexView() {
  // The index list isn't re-rendered while it's hidden, so its "+"/"✓"
  // basket toggles can go stale if the basket changed elsewhere (e.g.
  // clearing the list from the shopping list view). Refresh it here so
  // it's always accurate by the time it's shown.
  renderList();
  showView('index');
  document.title = 'My Recipes';
  window.scrollTo(0, takeRestoreScroll());
  document.getElementById('site-title').focus({ preventScroll: true });
}

// Rebuilds the shopping list content in place — used for interactions
// that happen while already on the view (checking an item, removing a
// recipe chip, clearing the list) so they don't reset scroll or steal
// focus the way a full view transition does.
function renderShoppingListContent() {
  // Replacing the DOM below would otherwise jump the page back to the
  // top, since the browser resets scroll when it loses track of the
  // interacted element. Preserve the scroll position explicitly so an
  // in-place update (checking an item, removing a chip, clearing) never
  // moves the page.
  const scrollY = window.scrollY;

  const basketRecipes = [...basket].map(id => recipes.find(r => r.id === id)).filter(Boolean);
  const groups = buildShoppingList();

  const chipsHtml = basketRecipes.map(r => `
    <span class="basket-chip">${esc(r.title)} <button onclick="removeFromBasket('${r.id}')" aria-label="Remove ${esc(r.title)} from shopping list">×</button></span>
  `).join('');

  const sectionsHtml = groups.map(({ section, items }) => `
    <section class="recipe-section">
      <h2 class="section-heading">${esc(section)}</h2>
      <ul class="shopping-items">
        ${items.map(item => {
          const checked = checkedItems.has(item.name);
          return `
          <li class="shopping-item${checked ? ' checked' : ''}">
            <label class="shopping-item-label">
              <input type="checkbox" class="shopping-item-checkbox" data-name="${esc(item.name)}" ${checked ? 'checked' : ''} onchange="toggleChecked(this.dataset.name)">
