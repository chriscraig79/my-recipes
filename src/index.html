              <div class="shopping-item-main">
                <span class="shopping-item-name">${esc(item.name)}</span>
                <span class="shopping-item-recipe">${esc(item.recipeTitles.join(', '))}</span>
              </div>
            </label>
          </li>
        `;
        }).join('')}
      </ul>
    </section>
  `).join('');

  const hasUnchecked = groups.some(({ items }) => items.some(item => !checkedItems.has(item.name)));

  document.getElementById('shopping-list-content').innerHTML = `
    <header class="recipe-header">
      <!-- The nav already says "Shopping list" and the count, so the title
           is for screen readers only. -->
      <h1 class="visually-hidden" id="shopping-list-title" tabindex="-1">Shopping list</h1>
      ${basketRecipes.length ? `
        <div class="basket-chips">
          ${chipsHtml}
          <button class="clear-list-btn" onclick="clearBasket()">Clear list</button>
        </div>` : ''}
    </header>

    ${basketRecipes.length ? `
      <div class="shopping-actions">
        ${hasUnchecked ? `
          <a class="whatsapp-btn" href="${buildWhatsAppUrl(groups)}" target="_blank" rel="noopener">Send to WhatsApp</a>
          <button class="copy-list-btn" aria-live="polite" onclick="copyShoppingList(this)">Copy list</button>
        ` : `<span class="all-checked-note">Everything's checked off</span>`}
      </div>
      ${sectionsHtml}
      <hr class="footer-rule">
    ` : `
      <div class="empty-state">
        <span class="empty-state-icon" aria-hidden="true">${BASKET_ICON}</span>
        <h2 class="empty-state-title">Nothing on your list yet</h2>
        <p class="empty-state-text">
          Tap <span class="empty-state-plus" aria-hidden="true">${PLUS_ICON}</span><span class="visually-hidden">the plus button</span>
          on any recipe and its ingredients will appear here, grouped by aisle.
        </p>
        <a class="empty-state-action" href="#" onclick="event.preventDefault(); showIndex()">Browse recipes</a>
      </div>
    `}
  `;

  window.scrollTo(0, scrollY);
}

// Full transition into the shopping list view — scrolls to top and
// moves focus to the heading. Only call this when actually navigating
// to the view; use renderShoppingListContent() for in-place updates.
function renderShoppingListView() {
  renderShoppingListContent();
  showView('shopping-list');
  document.title = 'Shopping List – My Recipes';
  window.scrollTo(0, takeRestoreScroll());
  document.getElementById('shopping-list-title').focus({ preventScroll: true });
}

function showView(name) {
  document.getElementById('index').style.display = name === 'index' ? 'block' : 'none';
  document.getElementById('recipe-view').style.display = name === 'recipe' ? 'block' : 'none';
  document.getElementById('shopping-list-view').style.display = name === 'shopping-list' ? 'block' : 'none';
  updateNavCurrent(name);
  updateBackToTop();
}

// A recipe page counts as part of "Recipes" in the nav.
// On a recipe page nothing in the nav is the current page, so "Recipes"
// becomes "← Back to recipes" instead of being marked as current.
function updateNavCurrent(view) {
  const current = { index: 'nav-recipes', 'shopping-list': 'shopping-list-link' }[view] || null;
  const recipes = document.getElementById('nav-recipes');
  const label = view === 'recipe'
    ? '<span class="nav-back-arrow" aria-hidden="true">←</span> Back to recipes'
    : 'Recipes';
  if (recipes.innerHTML !== label) recipes.innerHTML = label;
  ['nav-recipes', 'shopping-list-link'].forEach(id => {
    const link = document.getElementById(id);
    if (id === current) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  placeNavIndicator();
}

// Moves the accent bar under the current link. It slides between links,
// and stays where it was (just fading out) when there's no current link.
function placeNavIndicator() {
  const indicator = document.getElementById('nav-indicator');
  const current = document.querySelector('.site-nav-link[aria-current="page"]');
  if (current) {
    const inner = indicator.parentElement.getBoundingClientRect();
    const box = current.getBoundingClientRect();
    indicator.style.transform = `translateX(${box.left - inner.left}px)`;
    indicator.style.width = `${box.width}px`;
  }
  indicator.style.opacity = current ? '1' : '0';
  // Only animate after it's first been placed, so it doesn't slide in on load.
  if (!indicator.classList.contains('is-ready')) {
    requestAnimationFrame(() => indicator.classList.add('is-ready'));
  }
}

window.addEventListener('resize', placeNavIndicator);
document.fonts?.ready.then(placeNavIndicator);

function currentHeading() {
  const ids = { index: 'site-title', recipe: 'recipe-title', 'shopping-list': 'shopping-list-title' };
  return document.getElementById(ids[currentView()]);
}

// ─────────────────────────────────────────────
//  BACK TO TOP
// ─────────────────────────────────────────────

// Shown once you've scrolled half a screen, and kept out of the way of
// the toast, which shares the bottom of the screen.
function updateBackToTop() {
  const show = window.scrollY > window.innerHeight / 2 && document.getElementById('toast').hidden;
  document.getElementById('back-to-top').classList.toggle('is-visible', show);
}

function backToTop() {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  currentHeading()?.focus({ preventScroll: true });
}

// ─────────────────────────────────────────────
//  SCROLL MEMORY — back and forward return you to where you were
// ─────────────────────────────────────────────

// Each history entry keeps its own scroll position in history.state. It's
// saved shortly after you stop scrolling and on every click (which is how
// you leave a page), so it's there when you come back with the browser's
// back or forward button. A brand new entry has no saved position and
// opens at the top.
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

let restoreScrollY = null;
// Where you were on the index, so the nav's "Recipes" link takes you back
// to the same place in the list.
let lastIndexScrollY = 0;

function takeRestoreScroll() {
  const y = restoreScrollY ?? 0;
  restoreScrollY = null;
  return y;
}

function saveScroll() {
  if (currentView() === 'index') lastIndexScrollY = window.scrollY;
  const state = history.state && typeof history.state === 'object' ? history.state : {};
  history.replaceState({ ...state, scrollY: window.scrollY }, '');
}

let saveScrollTimer = null;
window.addEventListener('scroll', () => {
  clearTimeout(saveScrollTimer);
  saveScrollTimer = setTimeout(saveScroll, 200);
}, { passive: true });
document.addEventListener('click', () => { clearTimeout(saveScrollTimer); saveScroll(); }, true);
window.addEventListener('pagehide', saveScroll);

function savedScrollY() {
  const y = history.state?.scrollY;
  return typeof y === 'number' ? y : null;
}

// ─────────────────────────────────────────────
//  ROUTING — each recipe gets a shareable #slug URL
// ─────────────────────────────────────────────

// A hash is "#<recipe-id>", "#<recipe-id>/step-<n>" or "#shopping-list".
function parseHash() {
  const [id, stepPart] = decodeURIComponent(location.hash.slice(1)).split('/');
  const match = /^step-(\d+)$/.exec(stepPart || '');
  return { id, step: match ? Number(match[1]) : null };
}

// Id of the recipe currently rendered in the recipe view, so moving between
// that recipe's own step links doesn't re-render (and re-scroll) the page.
let renderedRecipeId = null;

// Scrolls to step n of the open recipe and rings it; null just clears the
// ring. Focus moves to the step so screen readers and keyboards follow.
function showStep(n) {
  document.querySelectorAll('.step.is-target').forEach(el => el.classList.remove('is-target'));
  const step = n && document.getElementById(`step-${n}`);
  if (!step) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  step.classList.add('is-target');
  step.focus({ preventScroll: true });
  step.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
}

// Tapping anywhere on a step card follows its number link, except when the
// tap was on another link/button or ended a text selection.
document.getElementById('recipe-content').addEventListener('click', e => {
  const step = e.target.closest('.step');
  if (!step || e.target.closest('a, button')) return;
  if (window.getSelection().toString()) return;
  location.hash = step.querySelector('.step-number').getAttribute('href');
});

function route() {
  const { id, step } = parseHash();
  restoreScrollY = savedScrollY();
  if (id === 'shopping-list') {
    renderShoppingListView();
    return;
  }
  const recipe = recipes.find(r => r.id === id);
  if (recipe && currentView() === 'recipe' && renderedRecipeId === recipe.id) {
    showStep(step);
    if (!step) window.scrollTo(0, takeRestoreScroll());
    restoreScrollY = null;
  } else if (recipe) {
    navigateWithTransition('recipe', () => { renderRecipe(recipe); showStep(step); });
  } else {
    navigateWithTransition('index', renderIndexView);
  }
}

function currentView() {
  if (document.getElementById('recipe-view').style.display === 'block') return 'recipe';
  if (document.getElementById('shopping-list-view').style.display === 'block') return 'shopping-list';
  return 'index';
}

// Runs a view change, animated when it's the index opening a recipe
// ("forward") or a recipe going back to the index ("back"). Anything else,
// browsers without view transitions, and reduced-motion users get the
// change instantly. The CSS under "View transitions" does the animating.
function navigateWithTransition(to, update) {
  const from = currentView();
  const direction = from === 'index' && to === 'recipe' ? 'forward'
    : from === 'recipe' && to === 'index' ? 'back'
    : null;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!direction || reduceMotion || !document.startViewTransition) {
    update();
    return;
  }
  const root = document.documentElement;
  root.dataset.nav = direction;
  const transition = document.startViewTransition(update);
  transition.finished.finally(() => { delete root.dataset.nav; });
}

function showRecipe(id) {
  location.hash = id;
}

// The nav's "Recipes" link. From another page it returns you to where you
// were in the list; on the index itself it goes back to the top.
function showIndex() {
  if (currentView() === 'index') {
    backToTop();
    return;
  }
  restoreScrollY = lastIndexScrollY;
  if (location.hash) {
    history.pushState(null, '', location.pathname + location.search);
  }
  navigateWithTransition('index', renderIndexView);
}

window.addEventListener('hashchange', route);

buildFilters();
initSearch();
renderList();
renderBasketBadge();

updateNavCurrent('index');

// On a reload, pick up where you were.
const initial = parseHash();
restoreScrollY = savedScrollY();
if (initial.id === 'shopping-list') {
  renderShoppingListView();
} else {
  const initialRecipe = recipes.find(r => r.id === initial.id);
  if (initialRecipe) {
    renderRecipe(initialRecipe);
    showStep(initial.step);
  } else {
    window.scrollTo(0, takeRestoreScroll());
  }
}
</script>
</body>
</html>
