<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --warm-white: #faf7f2;
    --card-bg: #ffffff;
    --ink: #1c1812;
    --muted: #6b5f4e;
    --accent: #b5470a;
    --accent-soft: #f1e2d3;
    --border: #d9cfc0;
    --rule: #c4b8a4;
    --step-num: #ece5d8;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-pill: 999px;
    /* Shared card look (index cards, recipe overview, ingredients, steps):
       white, thin border, small soft shadow. */
    --card-border: 1px solid var(--border);
    --shadow-card: 0 1px 2px rgba(28, 24, 18, 0.05), 0 2px 6px rgba(28, 24, 18, 0.05);
    --font-serif: 'Playfair Display', serif;
    --font-body: 'Source Serif 4', Georgia, serif;
    --font-sans: 'Inter', system-ui, sans-serif;
  }

  body {
    background: var(--warm-white);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── Index ── */
  #index {
    max-width: 1120px;
    margin: 0 auto;
    padding: 1.5rem 2rem 5rem;
  }

  .site-header {
    border-top: 3px solid var(--ink);
    padding: 0.85rem 0 0.65rem;
    margin-bottom: 0.85rem;
  }

  .site-header::after {
    content: '';
    display: block;
    border-bottom: 3px solid var(--ink);
    margin-top: 0.65rem;
  }

  .site-label {
    font-family: var(--font-sans);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }

  .site-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 600;
    line-height: 1.05;
  }

  .site-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  /* ── Filters ── */
  /* One joined button group: a dropdown per category (Protein, Carbs, Veg,
     Dish, Time). Segments shrink to fit, so the whole group always stays
     on one line, even on a phone. */
  /* Pinned to the top while scrolling the index, like the recipe jump bar.
     It bleeds out over the index's side padding so the bar spans the screen,
     and gets a bottom rule once it's stuck. */
  .filters {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 0.6rem 2rem;
    margin: -0.6rem -2rem 0.65rem;
    background: var(--warm-white);
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .filters.is-stuck { border-bottom-color: var(--border); }

  .filter-bar {
    display: flex;
    width: 100%;
    max-width: 38rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--card-bg);
  }

  .filter-seg {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
  }

  .filter-seg + .filter-seg {
    border-left: 1px solid var(--border);
  }

  .filter-seg:first-child,
  .filter-seg:first-child .filter-trigger { border-radius: var(--radius-pill) 0 0 var(--radius-pill); }
  .filter-seg:last-child,
  .filter-seg:last-child .filter-trigger,
  .filter-seg:last-child .filter-clear { border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }

  .filter-trigger {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
    min-height: 2.1rem;
    padding: 0.35rem 0.6rem;
    border: none;
    background: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }

  .filter-trigger:hover,
  .filter-trigger[aria-expanded="true"] { color: var(--accent); }

  .filter-trigger-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .filter-chevron {
    flex-shrink: 0;
    width: 0.7rem;
    height: 0.7rem;
    transition: transform 0.15s;
  }

  .filter-trigger[aria-expanded="true"] .filter-chevron { transform: rotate(180deg); }

  /* Active: dark fill, chosen value as the label, and an × to clear it
     in place of the chevron. Segments size to their labels and shrink in
     proportion when space is short, so a long choice ("Under 30 min")
     gives way before the short category names do. */
  .filter-seg.active { background: var(--ink); }
  .filter-seg + .filter-seg.active { border-left-color: var(--ink); }
  .filter-seg.active + .filter-seg.active { border-left-color: rgba(250, 247, 242, 0.3); }
  .filter-seg.active .filter-trigger,
  .filter-seg.active .filter-trigger:hover,
  .filter-seg.active .filter-trigger[aria-expanded="true"] { color: var(--warm-white); padding-right: 0.15rem; }
  .filter-seg.active .filter-chevron { display: none; }

  .filter-clear {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    min-height: 2.1rem;
    border: none;
    background: none;
    color: var(--warm-white);
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }

  .filter-clear[hidden] { display: none; }
  .filter-clear:hover { color: var(--accent-soft); }

  .filter-trigger:focus-visible,
  .filter-clear:focus-visible,
  .filter-option:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .filter-menu {
    position: absolute;
    top: calc(100% + 0.35rem);
    left: 0;
    z-index: 30;
    min-width: max(100%, 10rem);
    max-height: min(60vh, 22rem);
    overflow-y: auto;
    list-style: none;
    padding: 0.3rem;
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-sm);
    box-shadow: 0 4px 16px rgba(28, 24, 18, 0.12);
  }

  .filter-menu[hidden] { display: none; }

  /* Menus under the right-hand segments open leftwards so they stay on screen. */
  .filter-seg:nth-last-child(-n+2) .filter-menu { left: auto; right: 0; }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    min-height: 2.25rem;
    padding: 0.4rem 0.7rem;
    border: none;
    border-radius: 6px;
    background: none;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 0.82rem;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }

  .filter-option:hover,
  .filter-option:focus { background: var(--accent-soft); }

  .filter-option-check {
    flex-shrink: 0;
    width: 0.9rem;
    height: 0.9rem;
    color: var(--accent);
    visibility: hidden;
  }

  .filter-option[aria-checked="true"] { font-weight: 600; }
  .filter-option[aria-checked="true"] .filter-option-check { visibility: visible; }

  .results-count {
    font-family: var(--font-sans);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  /* ── Recipe list ── */
  .recipe-list {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
  }

  .recipe-list-item {
    position: relative;
  }

  .recipe-card-btn {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    height: 100%;
    padding: 0;
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    cursor: pointer;
    text-align: left;
    color: var(--ink);
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .recipe-card-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 8px rgba(28, 24, 18, 0.06), 0 12px 24px rgba(28, 24, 18, 0.1);
  }

  .recipe-card-panel {
    position: relative;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--accent-soft);
  }

  .recipe-card-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .recipe-card-monogram {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 4rem;
    color: var(--ink);
    opacity: 0.22;
    line-height: 1;
  }

  .panel-chicken { background: #f1e2d3; }
  .panel-eggs { background: #f6ecc9; }
  .panel-pasta { background: #f3e6d6; }
  .panel-vegetarian { background: #dfe6d4; }
  .panel-pork { background: #f0d9cf; }
  .panel-potato { background: #e8dcc4; }
  .panel-beef { background: #e6d2ca; }
  .panel-seafood { background: #d9e2e2; }
  .panel-default { background: var(--accent-soft); }

  .recipe-card-text {
    display: flex;
    flex-direction: column;
    padding: 1rem 1.1rem 1.25rem;
    flex: 1;
  }

  .recipe-card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 600;
    display: block;
    margin-bottom: 0.35rem;
  }

  .recipe-card-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-bottom: 0.45rem;
  }

  .recipe-chip {
    font-family: var(--font-sans);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.15rem 0.55rem;
    border-radius: var(--radius-pill);
  }

  .recipe-chip.time { color: var(--accent); border-color: var(--accent); }

  .recipe-card-desc {
    font-size: 0.86rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    margin-top: auto;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .no-results {
    padding: 2rem 0;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    border-top: 1px solid var(--border);
  }

  /* ── Basket toggle (index card) ── */
  .basket-toggle {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    z-index: 2;
    flex-shrink: 0;
    width: 2.25rem;
    height: 2.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
  }

  .basket-toggle svg { width: 1.05rem; height: 1.05rem; }

  .basket-toggle:hover { color: var(--accent); }

  .basket-toggle.active {
    background: var(--accent);
    color: var(--warm-white);
  }

  /* ── Basket toggle (ingredients heading row) ── */
  .basket-toggle-large {
    flex-shrink: 0;
    white-space: nowrap;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.45rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius-pill);
    background: none;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
  }

  .basket-toggle-large.active {
    background: var(--accent);
    color: var(--warm-white);
  }

  /* ── Basket badge ── */
  .basket-badge {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--ink);
    color: var(--warm-white);
    border: none;
    border-radius: var(--radius-pill);
    padding: 0.65rem 1.1rem;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(28, 24, 18, 0.25);
    transition: background 0.15s;
    z-index: 10;
  }

  .basket-badge:hover { background: var(--accent); }
  .basket-badge[hidden] { display: none; }

  /* ── Recipe view / Shopping list view ── */
  #recipe-view, #shopping-list-view {
    display: none;
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }

  .recipe-hero {
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 2rem;
    max-height: 420px;
  }

  .recipe-hero img {
    width: 100%;
    height: 100%;
    max-height: 420px;
    object-fit: cover;
    display: block;
    aspect-ratio: 16 / 9;
  }

  .back-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0;
    margin-bottom: 2rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: color 0.15s;
  }

  .back-btn:hover { color: var(--accent); }

  .recipe-header {
    border-top: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    padding: 2rem 0 1.5rem;
    margin-bottom: 2.5rem;
  }

  .recipe-label {
    font-family: var(--font-sans);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .recipe-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 600;
    line-height: 1.1;
  }

  .recipe-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  .recipe-description {
    margin-top: 1rem;
    font-size: 1rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Playfair Display', serif;
  }

  .recipe-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    margin-top: 1.5rem;
    border: var(--card-border);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--card-bg);
    box-shadow: var(--shadow-card);
  }

  .recipe-stat {
    padding: 0.9rem 1.1rem;
    border-right: 1px solid var(--border);
  }

  .recipe-stat:last-child { border-right: none; }

  .stat-label {
    display: block;
    font-family: var(--font-sans);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }

  .stat-value {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
  }

  /* ── Recipe section jump bar ──
     Pinned to the top while scrolling a recipe; tapping a button scrolls to
     that section, and the section currently being read stays highlighted. */
  .recipe-jump {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    /* Bleed out over the view's side padding so the bar spans the screen. */
    padding: 0.6rem 2rem;
    margin: -0.6rem -2rem 1.75rem;
    background: var(--warm-white);
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .recipe-jump.is-stuck { border-bottom-color: var(--border); }

  .jump-group {
    display: inline-flex;
    padding: 0.2rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--card-bg);
  }

  .jump-btn {
    font-family: var(--font-sans);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.45rem 1.15rem;
    min-width: 7.5rem;
    border: none;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .jump-btn:hover { color: var(--accent); }

  .jump-btn[aria-current="true"] {
    background: var(--accent);
    color: var(--warm-white);
  }

  /* Leave room for the pinned bar when jumping to a section. */
  #recipe-ingredients, #recipe-method { scroll-margin-top: 4rem; }

  section.recipe-section { margin-bottom: 2.5rem; }

  h2.section-heading {
    font-family: var(--font-sans);
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .section-heading-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .section-heading-row .section-heading {
    margin-bottom: 0;
  }

  /* Ingredients: a true grid (2 columns when the card is wide enough, 1 on
     phones). In 2 columns every row is the same height, so cells line up
     across the columns, and items still read top-to-bottom down the left
     column first (--rows is set from the item count in renderRecipe).
     Dividers run edge to edge: each cell has a bottom rule (the list's
     bottom 1px is clipped so the last row has none, leaving the card's own
     border), and left-column cells have a right rule. Amounts sit in their
     own right-aligned column so quantities line up for scanning. */
  .ingredients-card {
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    container-type: inline-size;
  }

  .ingredients-grid {
    display: grid;
    grid-template-columns: 1fr;
    list-style: none;
    clip-path: inset(0 0 1px 0);
  }

  @container (min-width: 36rem) {
    .ingredients-grid {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(var(--rows), 1fr);
      grid-auto-flow: column;
    }

    .ingredient.is-left-col { border-right: 1px solid var(--step-num); }
  }

  .ingredient {
    display: grid;
    grid-template-columns: 5.5rem 1fr;
    column-gap: 0.9rem;
    align-items: baseline;
    align-content: center;
    padding: 0.6rem 1.35rem;
    border-bottom: 1px solid var(--step-num);
    line-height: 1.35;
  }

  .ingredient-amount {
    font-family: var(--font-serif);
    font-weight: 600;
    color: var(--accent);
    font-size: 0.85rem;
    text-align: right;
    overflow-wrap: anywhere;
  }

  .ingredient-amount.is-vague {
    font-weight: 400;
    font-style: italic;
    color: var(--muted);
  }

  .ingredient-name {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.9rem;
  }

  .ingredient-prep {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
  }

  .steps {
    list-style: none;
  }

  /* Step number is a small filled badge on the title line; the step's text
     runs the full width of the card underneath instead of sitting beside a
     wide number column. */
  .step {
    margin-bottom: 1rem;
    padding: 1rem 1.35rem 1.1rem;
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
  }

  .step-head {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 0.35rem;
  }

  .step-number {
    flex-shrink: 0;
    width: 1.75rem;
    height: 1.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--warm-white);
    font-family: var(--font-sans);
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1;
  }

  .step-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .step-content {
    font-size: 0.93rem;
    color: #3d3427;
    line-height: 1.65;
  }

  .step-timer {
    display: inline-block;
    margin-top: 0.4rem;
    font-family: var(--font-sans);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.15rem 0.6rem;
    border-radius: var(--radius-pill);
  }

  .notes-box {
    background: var(--cream);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    padding: 1.25rem 1.5rem;
    font-size: 0.88rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.7;
  }

  .footer-rule {
    border: none;
    border-top: 3px solid var(--ink);

  /* ── Shopping list ── */

  .whatsapp-btn:hover { opacity: 0.85; }

  /* Same shape as the WhatsApp button, outlined so WhatsApp stays the
     primary action. */
  .copy-list-btn {
    background: var(--card-bg);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius-pill);
    padding: calc(0.7rem - 1px) 1.4rem;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;

  .copy-list-btn:hover,
  .copy-list-btn.copied {

  .clear-list-btn {

  .shopping-items { list-style: none; }

  .shopping-item {
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }

  .shopping-item-label {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    cursor: pointer;
  }

  .shopping-item-checkbox {
    appearance: none;
    -webkit-appearance: none;
    margin-top: 0.2rem;
    width: 1.15rem;
    height: 1.15rem;
    flex-shrink: 0;
    border: 1.5px solid var(--muted);
    border-radius: 3px;
    background: var(--warm-white);
    cursor: pointer;

    transition: background 0.15s, border-color 0.15s;
  }

  .shopping-item-checkbox:hover { border-color: var(--accent); }

  .shopping-item-checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .shopping-item-checkbox:checked::after {
    content: '';
    position: absolute;
    left: 0.36rem;
    top: 0.16rem;
    width: 0.3rem;
    height: 0.58rem;
    border: solid var(--warm-white);
    border-width: 0 2px 2px 0;

  }

  .shopping-item-checkbox:focus-visible {

  .shopping-item-main {

  .shopping-item-recipe {

  .shopping-item.checked .shopping-item-name,

  .all-checked-note {

  @media (max-width: 500px) {
    .ingredient { grid-template-columns: 4.5rem 1fr; column-gap: 0.75rem; padding: 0.6rem 1rem; }
    .recipe-list { grid-template-columns: 1fr; }
    .recipe-stats { grid-template-columns: 1fr; }
    .recipe-stat { border-right: none; border-bottom: 1px solid var(--border); }
    .recipe-stat:last-child { border-bottom: none; }
    .basket-badge { right: 1rem; bottom: 1rem; padding: 0.55rem 0.9rem; font-size: 0.75rem; }

    #index { padding: 1rem 1rem 3rem; }
    .site-header { padding: 0.65rem 0 0.5rem; margin-bottom: 0.65rem; }
    .site-header::after { margin-top: 0.5rem; }
    .site-label { margin-bottom: 0.2rem; }
    .filters { padding: 0.5rem 1rem; margin: -0.5rem -1rem 0.35rem; }
    .filter-trigger { padding: 0.35rem 0.35rem; gap: 0.2rem; font-size: 0.7rem; }
    .filter-chevron { width: 0.6rem; height: 0.6rem; }

    .results-count { margin-bottom: 0.65rem; }

</style>
</head>
<body>

<main>

<div id="index">
  <header class="site-header">
    <p class="site-label">Recipe collection &amp; shopping list generator</p>
    <h1 class="site-title" id="site-title" tabindex="-1">My <em>Recipes</em></h1>
  </header>

  <div class="filters">
    <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter recipes"></div>
  </div>

  <p class="results-count" id="results-count" aria-live="polite"></p>
  <ul class="recipe-list" id="recipe-list"></ul>
</div>

<div id="recipe-view">
  <button class="back-btn" onclick="showIndex()">← All recipes</button>
  <div id="recipe-content"></div>
</div>

<div id="shopping-list-view">
  <button class="back-btn" onclick="showIndex()">← All recipes</button>
  <div id="shopping-list-content"></div>
</div>

</main>

<button id="basket-badge" class="basket-badge" hidden onclick="showShoppingList()">🛒 Shopping list (0)</button>

<script>
// ─────────────────────────────────────────────
//  RECIPE DATA — GENERATED, DO NOT EDIT BY HAND
//
//  Source of truth is recipes/*.yaml + ingredients.yaml. Edit those,
//  then run `npm run build` to regenerate the block below.
//  Shape per recipe: see any file in recipes/ for the fields
//  (id, title, titleHtml, label, servings, time, timeMins, cookedIn,
//  description, tags, ingredients, steps, notes).
// ─────────────────────────────────────────────

// GENERATED:RECIPES:START

const recipes = []; // placeholder — real data injected by `npm run build` into build/index.html
// GENERATED:RECIPES:END

// ─────────────────────────────────────────────
//  SHOPPING BASKET
//
//  Each ingredient's `section` is precomputed at build time from
//  ingredients.yaml (see scripts/build.mjs) — no runtime guessing.
// ─────────────────────────────────────────────

const SECTION_ORDER = ["Fruit & Veg", "Meat & Fish", "Deli & Dairy", "Dry Goods & Spices", "Tinned & Jarred", "Bread & Bakery", "Other"];

function loadBasket() {
  try {
    return new Set(JSON.parse(localStorage.getItem('recipeBasket')) || []);
  } catch {
    return new Set();
  }
}

function saveBasket() {
  try {
    localStorage.setItem('recipeBasket', JSON.stringify([...basket]));
  } catch {}
}

let basket = loadBasket();

function loadCheckedItems() {
  try {
    return new Set(JSON.parse(localStorage.getItem('shoppingChecked')) || []);
  } catch {
    return new Set();
  }
}

function saveCheckedItems() {
  try {
    localStorage.setItem('shoppingChecked', JSON.stringify([...checkedItems]));
  } catch {}
}

let checkedItems = loadCheckedItems();

function toggleChecked(name) {
  checkedItems.has(name) ? checkedItems.delete(name) : checkedItems.add(name);
  saveCheckedItems();
  renderShoppingListContent();
}

function toggleBasket(id) {
  basket.has(id) ? basket.delete(id) : basket.add(id);
  saveBasket();
  renderBasketBadge();
  refreshCurrentView();
}

function removeFromBasket(id) {
  basket.delete(id);
  saveBasket();
  renderBasketBadge();
  renderShoppingListContent();
}

function clearBasket() {
  basket.clear();
  checkedItems.clear();
  saveBasket();
  saveCheckedItems();
  renderBasketBadge();
  renderShoppingListContent();
}

function renderBasketBadge() {
  const badge = document.getElementById('basket-badge');
  badge.hidden = basket.size === 0;
  badge.textContent = `🛒 Shopping list (${basket.size})`;
}

// Ingredients with the same name (across recipes, or repeated within one)
// are combined into a single line listing every recipe that needs it —
// no amount shown, since amounts from different recipes aren't merged.
function buildShoppingList() {
  const grouped = new Map();
  basket.forEach(id => {
    const r = recipes.find(x => x.id === id);
    if (!r) return;
    r.ingredients.forEach(ing => {
      const section = ing.section;
      if (!grouped.has(section)) grouped.set(section, new Map());
      const bySection = grouped.get(section);
      if (!bySection.has(ing.name)) {
        bySection.set(ing.name, { name: ing.name, recipeTitles: [] });
      }
      const item = bySection.get(ing.name);
      if (!item.recipeTitles.includes(r.title)) item.recipeTitles.push(r.title);
    });
  });

  // Drop any checked state for items no longer in the list (e.g. after
  // removing a recipe) so it doesn't linger in storage indefinitely.
  const presentNames = new Set();
  grouped.forEach(bySection => bySection.forEach(item => presentNames.add(item.name)));
  let checkedChanged = false;
  checkedItems.forEach(name => {
    if (!presentNames.has(name)) { checkedItems.delete(name); checkedChanged = true; }
  });
  if (checkedChanged) saveCheckedItems();

  return SECTION_ORDER
    .filter(section => grouped.has(section))
    .map(section => ({ section, items: [...grouped.get(section).values()] }));
}

// Plain-text list shared by "Send to WhatsApp" and "Copy list": the basket's
// recipes under the title, then unchecked ingredients by section (names
// only — which recipe needs what is shown in the app, not the message).
function buildShoppingListText(groups) {
  const recipeTitles = [...basket].map(id => recipes.find(r => r.id === id)).filter(Boolean).map(r => r.title);
  const lines = ['Shopping List', ''];
  if (recipeTitles.length) {
    lines.push('RECIPES');
    recipeTitles.forEach(title => lines.push(`- ${title}`));
    lines.push('');
  }
  groups.forEach(({ section, items }) => {
    const unchecked = items.filter(item => !checkedItems.has(item.name));
    if (unchecked.length === 0) return;
    lines.push(section.toUpperCase());
    unchecked.forEach(item => lines.push(`- ${item.name}`));
    lines.push('');
  });
  return lines.join('\n').trim();
}

// Copies the same text the WhatsApp button sends (unchecked items only) —
// for devices without WhatsApp, e.g. an iPad. Falls back to a hidden
// textarea + execCommand where the async Clipboard API isn't available.
async function copyShoppingList(btn) {
  const text = buildShoppingListText(buildShoppingList());
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
  }
  btn.textContent = ok ? '✓ Copied' : 'Copy failed';
  btn.classList.toggle('copied', ok);
  clearTimeout(btn._resetTimer);
  btn._resetTimer = setTimeout(() => {
    btn.textContent = 'Copy list';
    btn.classList.remove('copied');
  }, 2000);
}

function buildWhatsAppUrl(groups) {
  const text = buildShoppingListText(groups);
  return `https://wa.me/?text=${encodeURIComponent(text)}`;
}

// ─────────────────────────────────────────────
//  FILTER STATE & LOGIC
// ─────────────────────────────────────────────

const TIME_BANDS = [
  { label: "Under 30 min", key: "under30", test: m => m < 30 },
  { label: "30–60 min",    key: "30to60",  test: m => m >= 30 && m <= 60 },
  { label: "Over 1 hr",    key: "over60",  test: m => m > 60 },
];

// Groups tags by the role they play in a meal — closer to how you'd
// actually plan one ("what's my protein, what's my carb, what veg") than a
// strict ingredient taxonomy — plus a "Dish" group for the kind of dish it
// is (curry, stew, bake…), so each group gets its own filter dropdown. Unknown tags fall into "Other".
const TAG_CATEGORIES = {
  bacon: "Protein", beef: "Protein", chicken: "Protein", lamb: "Protein", pork: "Protein", turkey: "Protein", gammon: "Protein",
  prawns: "Protein", seafood: "Protein", salmon: "Protein", tuna: "Protein", cod: "Protein", mussels: "Protein",
  eggs: "Protein", chickpeas: "Protein",
  potato: "Carbs", pasta: "Carbs", rice: "Carbs", noodles: "Carbs", dumplings: "Carbs",
  aubergine: "Veg", cabbage: "Veg", carrot: "Veg", vegetarian: "Veg", cucumber: "Veg", courgette: "Veg", mushroom: "Veg", spinach: "Veg", tomato: "Veg",
  curry: "Dish", stew: "Dish", soup: "Dish", roast: "Dish", bake: "Dish", fried: "Dish", sticky: "Dish",
  "stir-fry": "Dish", salad: "Dish", omelette: "Dish", pancakes: "Dish", sandwich: "Dish",
};
const CATEGORY_ORDER = ["Protein", "Carbs", "Veg", "Dish", "Other"];

// One active choice per category, keyed by category name, e.g.
// { Protein: "chicken", Time: "under30" }. Choices in different categories
// combine (AND); choosing again in the same category replaces the old choice.
const activeFilters = {};

const CHEVRON_ICON = '<svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const OPTION_CHECK_ICON = '<svg class="filter-option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function getAllTags() {
  const tags = new Set();
  recipes.forEach(r => r.tags.forEach(t => tags.add(t)));
  return [...tags].sort();
}

function getTagsByCategory() {
  const groups = new Map();
  getAllTags().forEach(tag => {
    const category = TAG_CATEGORIES[tag] || "Other";
    if (!groups.has(category)) groups.set(category, []);
    groups.get(category).push(tag);
  });
  return CATEGORY_ORDER
    .filter(category => groups.has(category))
    .map(category => ({ category, tags: groups.get(category) }));
}

function getTimeBandsPresent() {
  return TIME_BANDS.filter(band => recipes.some(r => band.test(r.timeMins)));
}

function filteredRecipes() {
  return recipes.filter(r => Object.entries(activeFilters).every(([category, value]) =>
    category === "Time"
      ? TIME_BANDS.find(b => b.key === value)?.test(r.timeMins)
      : r.tags.includes(value)
  ));
}

const capitalise = s => s.charAt(0).toUpperCase() + s.slice(1);

// Each dropdown's options: [{ value, label }]. Built once in buildFilters().
let filterCategories = [];

function buildFilters() {
  filterCategories = [
    ...getTagsByCategory().map(({ category, tags }) => ({
      category,
      options: tags.map(tag => ({ value: tag, label: capitalise(tag) })),
    })),
    { category: "Time", options: getTimeBandsPresent().map(b => ({ value: b.key, label: b.label })) },
  ];

  document.getElementById('filter-bar').innerHTML = filterCategories.map(({ category, options }) => {
    const slug = category.toLowerCase();
    const items = [{ value: "", label: "All" }, ...options].map(o => `
      <li role="none"><button type="button" class="filter-option" role="menuitemradio" tabindex="-1"
        data-value="${o.value}" aria-checked="false">${OPTION_CHECK_ICON}<span>${o.label}</span></button></li>
    `).join('');
    return `
      <div class="filter-seg" data-category="${category}">
        <button type="button" class="filter-trigger" id="filter-trigger-${slug}"
          aria-haspopup="menu" aria-expanded="false" aria-controls="filter-menu-${slug}">
          <span class="filter-trigger-text">${category}</span>${CHEVRON_ICON}
        </button>
        <button type="button" class="filter-clear" hidden>×</button>
        <ul class="filter-menu" id="filter-menu-${slug}" role="menu" aria-labelledby="filter-trigger-${slug}" hidden>${items}</ul>
      </div>
    `;
  }).join('');

  initFilterEvents();
  updateFilterUI();
}

function setFilter(category, value) {
  if (value) activeFilters[category] = value;
  else delete activeFilters[category];
  updateFilterUI();
  renderList();
  // If you're scrolled down the list when you change a filter, jump back to
  // the top of the new results rather than leaving you partway down them.
  const filters = document.querySelector('.filters');
  if (filters.classList.contains('is-stuck')) {
    const count = document.getElementById('results-count');
    window.scrollTo(0, count.getBoundingClientRect().top + window.scrollY - filters.offsetHeight);
  }
}

function updateFilterBarStuck() {
  const filters = document.querySelector('.filters');
  if (document.getElementById('index').style.display === 'none') return;
  filters.classList.toggle('is-stuck', filters.getBoundingClientRect().top <= 0 && window.scrollY > 0);
}

function updateFilterUI() {
  document.querySelectorAll('.filter-seg').forEach(seg => {
    const { category } = seg.dataset;
    const value = activeFilters[category];
    const option = value && filterCategories.find(c => c.category === category)?.options.find(o => o.value === value);
    const trigger = seg.querySelector('.filter-trigger');
    const clear = seg.querySelector('.filter-clear');

    seg.classList.toggle('active', Boolean(option));
    trigger.querySelector('.filter-trigger-text').textContent = option ? option.label : category;
    // The visible text is just the choice ("Chicken"); the accessible name
    // keeps the category in front of it so it still makes sense when read out.
    if (option) trigger.setAttribute('aria-label', `${category}: ${option.label}`);
    else trigger.removeAttribute('aria-label');
    clear.hidden = !option;
    clear.setAttribute('aria-label', option ? `Clear ${category} filter (${option.label})` : `Clear ${category} filter`);

    seg.querySelectorAll('.filter-option').forEach(btn => {
      btn.setAttribute('aria-checked', String(btn.dataset.value === (value || "")));
    });
  });
}

// ── Dropdown behaviour (menu button pattern) ──
// Enter, Space or ↓ on a button opens its menu with the current choice
// focused (↑ focuses the last option). Inside the menu: ↑/↓ move and wrap,
// Home/End jump, typing a letter jumps to the next option starting with it,
// Enter/Space choose, Esc closes back to the button, and Tab closes and moves on.

let openSeg = null;

function menuOptions(seg) {
  return [...seg.querySelectorAll('.filter-option')];
}

function openMenu(seg, focus = 'checked') {
  if (openSeg && openSeg !== seg) closeMenu(openSeg);
  const trigger = seg.querySelector('.filter-trigger');
  const menu = seg.querySelector('.filter-menu');
  menu.hidden = false;
  trigger.setAttribute('aria-expanded', 'true');
  openSeg = seg;
  const options = menuOptions(seg);
  const target = focus === 'last'
    ? options[options.length - 1]
    : options.find(o => o.getAttribute('aria-checked') === 'true') || options[0];
  target.focus();
}

function closeMenu(seg, { returnFocus = false } = {}) {
  seg.querySelector('.filter-menu').hidden = true;
  seg.querySelector('.filter-trigger').setAttribute('aria-expanded', 'false');
  if (openSeg === seg) openSeg = null;
  if (returnFocus) seg.querySelector('.filter-trigger').focus();
}

function initFilterEvents() {
  const bar = document.getElementById('filter-bar');

  bar.addEventListener('click', e => {
    const seg = e.target.closest('.filter-seg');
    if (!seg) return;
    const { category } = seg.dataset;

    if (e.target.closest('.filter-trigger')) {
      if (openSeg === seg) closeMenu(seg);
      else openMenu(seg);
    } else if (e.target.closest('.filter-clear')) {
      setFilter(category, null);
      seg.querySelector('.filter-trigger').focus();
    } else if (e.target.closest('.filter-option')) {
      setFilter(category, e.target.closest('.filter-option').dataset.value);
      closeMenu(seg, { returnFocus: true });
    }
  });

  bar.addEventListener('keydown', e => {
    const seg = e.target.closest('.filter-seg');
    if (!seg) return;

    if (e.target.classList.contains('filter-trigger')) {
      if (e.key === 'ArrowDown') { e.preventDefault(); openMenu(seg); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); openMenu(seg, 'last'); }
      return;
    }

    if (!e.target.classList.contains('filter-option')) return;
    const options = menuOptions(seg);
    const i = options.indexOf(e.target);
    const move = j => { e.preventDefault(); options[(j + options.length) % options.length].focus(); };

    switch (e.key) {
      case 'ArrowDown': move(i + 1); break;
      case 'ArrowUp': move(i - 1); break;
      case 'Home': move(0); break;
      case 'End': move(options.length - 1); break;
      case 'Escape': e.preventDefault(); closeMenu(seg, { returnFocus: true }); break;
      case 'Tab': closeMenu(seg); break;
      default:
        if (e.key.length === 1 && /\S/.test(e.key)) {
          const key = e.key.toLowerCase();
          const order = [...options.slice(i + 1), ...options.slice(0, i + 1)];
          const match = order.find(o => o.textContent.trim().toLowerCase().startsWith(key));
          if (match) { e.preventDefault(); match.focus(); }
        }
    }
  });

  // Click or tap anywhere outside the open menu closes it.
  document.addEventListener('click', e => {
    if (openSeg && !openSeg.contains(e.target)) closeMenu(openSeg);
  });

  // Focus leaving the open dropdown by any other route also closes it.
  bar.addEventListener('focusout', e => {
    if (openSeg && e.relatedTarget && !openSeg.contains(e.relatedTarget)) closeMenu(openSeg);
  });
}

// ─────────────────────────────────────────────
//  RENDERING
// ─────────────────────────────────────────────

// Homepage cards with no photo yet fall back to a tag-colored panel with
// a large monogram — a typographic stand-in, never a fake photo.
const PANEL_TAGS = ['chicken', 'eggs', 'pasta', 'vegetarian', 'pork', 'potato', 'beef', 'seafood'];

function tagPanelClass(tags) {
  const match = tags.find(t => PANEL_TAGS.includes(t));
  return match ? `panel-${match}` : 'panel-default';
}

const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function renderList() {
  const list = document.getElementById('recipe-list');
  const count = document.getElementById('results-count');
  const results = filteredRecipes();

  count.textContent = `${results.length} recipe${results.length !== 1 ? 's' : ''}`;

  if (results.length === 0) {
    list.innerHTML = '<p class="no-results">No recipes match those filters.</p>';
    return;
  }

  list.innerHTML = results.map(r => {
    const tagChips = r.tags.map(t => `<span class="recipe-chip">${t}</span>`).join('');
    const timeBand = TIME_BANDS.find(b => b.test(r.timeMins));
    const timeChip = timeBand ? `<span class="recipe-chip time">${r.time}</span>` : '';
    const inBasket = basket.has(r.id);
    const panel = r.image
      ? `<img class="recipe-card-photo" src="images/${r.image}" alt="" loading="lazy">`
      : `<span class="recipe-card-monogram">${r.title.charAt(0)}</span>`;
    return `
      <li class="recipe-list-item">
        <button class="recipe-card-btn" onclick="showRecipe('${r.id}')">
          <div class="recipe-card-panel ${tagPanelClass(r.tags)}">${panel}</div>
          <div class="recipe-card-text">
            <span class="recipe-card-title">${r.title}</span>
            <div class="recipe-card-chips">${tagChips}${timeChip}</div>
            <span class="recipe-card-desc">${r.description}</span>
          </div>
        </button>
        <button class="basket-toggle${inBasket ? ' active' : ''}" aria-pressed="${inBasket}" aria-label="${inBasket ? 'Remove from shopping list' : 'Add to shopping list'}" onclick="toggleBasket('${r.id}')">${inBasket ? CHECK_ICON : PLUS_ICON}</button>
      </li>
    `;
  }).join('');
}

function renderRecipe(r) {
  // Amounts that aren't a measurement ("to taste", "as needed", "a squeeze")
  // get a quieter style so the real quantities stand out down the column.
  // In the 2-column layout the left column holds the first half (rounded up).
  const ingredientRows = Math.ceil(r.ingredients.length / 2);
  const ingredientsHtml = r.ingredients.map((ing, i) => {
    const amount = ing.amount || '';
    const vague = amount && !/\d|[½⅓¼¾⅔]/.test(amount);
    return `
    <li class="ingredient${i < ingredientRows ? ' is-left-col' : ''}">
      <span class="ingredient-amount${vague ? ' is-vague' : ''}">${amount}</span>
      <span class="ingredient-text">
        <span class="ingredient-name">${ing.name}</span>
        ${ing.prep ? `<span class="ingredient-prep">${ing.prep}</span>` : ''}
      </span>
    </li>
  `;
  }).join('');

  const stepsHtml = r.steps.map((step, i) => `
    <li class="step">
      <div class="step-head">
        <span class="step-number" aria-hidden="true">${i + 1}</span>
        <div class="step-title">${step.title}</div>
      </div>
      <div class="step-content">${step.content}</div>
      ${step.timer ? `<span class="step-timer">${step.timer}</span>` : ''}
    </li>
  `).join('');

  const inBasket = basket.has(r.id);

  const heroHtml = r.image
    ? `<div class="recipe-hero"><img src="images/${r.image}" alt="${r.title}"></div>`
    : '';

  const stats = [
    { label: 'Time', value: r.time },
    { label: 'Servings', value: r.servings },
    { label: 'Cooked in', value: r.cookedIn }
  ];
  const statsHtml = stats.map(s => `
    <div class="recipe-stat">
      <span class="stat-label">${s.label}</span>
      <span class="stat-value">${s.value}</span>
    </div>
  `).join('');

  document.getElementById('recipe-content').innerHTML = `
    ${heroHtml}
    <header class="recipe-header">
      <p class="recipe-label">${r.label} — serves ${r.servings}</p>
      <h1 class="recipe-title" id="recipe-title" tabindex="-1">${r.titleHtml}</h1>
      <p class="recipe-description">${r.description}</p>
      <div class="recipe-stats">${statsHtml}</div>
    </header>

    <nav class="recipe-jump" id="recipe-jump" aria-label="Recipe sections">
      <div class="jump-group">
        <button class="jump-btn" data-target="recipe-ingredients" aria-current="true" onclick="jumpToSection('recipe-ingredients')">Ingredients</button>
        <button class="jump-btn" data-target="recipe-method" aria-current="false" onclick="jumpToSection('recipe-method')">Method</button>
      </div>
    </nav>

    <section class="recipe-section" id="recipe-ingredients">
      <div class="section-heading-row">
        <h2 class="section-heading">Ingredients</h2>
        <button class="basket-toggle-large${inBasket ? ' active' : ''}" aria-pressed="${inBasket}" onclick="toggleBasket('${r.id}')">${inBasket ? '✓ In shopping list' : '+ Add to shopping list'}</button>
      </div>
      <div class="ingredients-card"><ul class="ingredients-grid" style="--rows: ${ingredientRows}">${ingredientsHtml}</ul></div>
    </section>

    <section class="recipe-section" id="recipe-method">
      <h2 class="section-heading">Method</h2>
      <ol class="steps">${stepsHtml}</ol>
    </section>

    <section class="recipe-section">
      <h2 class="section-heading">Notes</h2>
      <div class="notes-box">${r.notes}</div>
    </section>

    <hr class="footer-rule">
  `;

  showView('recipe');
  document.title = `${r.title} – My Recipes`;
  window.scrollTo(0, 0);
  document.getElementById('recipe-title').focus();
  updateJumpBar();
}

// ─────────────────────────────────────────────
//  RECIPE JUMP BAR — Ingredients | Method
// ─────────────────────────────────────────────

// While a tap-triggered smooth scroll is in flight, keep the tapped button
// highlighted rather than flickering through the sections it passes.
let jumpLockTimer = null;
let jumpLocked = false;

function jumpToSection(id) {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setActiveJump(id);
  jumpLocked = true;
  document.getElementById(id).scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  releaseJumpLockSoon();
}

// Released once scrolling has been quiet briefly (works in browsers without
// a `scrollend` event too).
function releaseJumpLockSoon() {
  clearTimeout(jumpLockTimer);
  jumpLockTimer = setTimeout(() => { jumpLocked = false; updateJumpBar(); }, 150);
}

function setActiveJump(id) {
  document.querySelectorAll('.jump-btn').forEach(btn => {
    btn.setAttribute('aria-current', btn.dataset.target === id ? 'true' : 'false');
  });
}

// Highlights "Method" once its section reaches the bar (or the page can't
// scroll any further), otherwise "Ingredients".
function updateJumpBar() {
  const bar = document.getElementById('recipe-jump');
  const method = document.getElementById('recipe-method');
  if (!bar || !method || document.getElementById('recipe-view').style.display === 'none') return;
  const barBottom = bar.getBoundingClientRect().bottom;
  bar.classList.toggle('is-stuck', bar.getBoundingClientRect().top <= 0 && window.scrollY > 0);
  if (jumpLocked) return;
  const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  setActiveJump(method.getBoundingClientRect().top <= barBottom + 24 || atBottom ? 'recipe-method' : 'recipe-ingredients');
}

let jumpBarFrame = null;
window.addEventListener('scroll', () => {
  if (jumpLocked) releaseJumpLockSoon();
  if (jumpBarFrame) return;
  jumpBarFrame = requestAnimationFrame(() => { jumpBarFrame = null; updateJumpBar(); updateFilterBarStuck(); });
}, { passive: true });

function renderIndexView() {
  // The index list isn't re-rendered while it's hidden, so its "+"/"✓"
  // basket toggles can go stale if the basket changed elsewhere (e.g.
  // clearing the list from the shopping list view). Refresh it here so
  // it's always accurate by the time it's shown.
  renderList();
  showView('index');
  document.title = 'My Recipes';
  window.scrollTo(0, 0);
  document.getElementById('site-title').focus();
}

// Rebuilds the shopping list content in place — used for interactions
// that happen while already on the view (checking an item, removing a
// recipe chip, clearing the list) so they don't reset scroll or steal
// focus the way a full view transition does.
function renderShoppingListContent() {
  // Replacing the DOM below would otherwise jump the page back to the
  // top, since the browser resets scroll when it loses track of the
  // interacted element. Preserve the scroll position explicitly so an
  // in-place update (checking an item, removing a chip, clearing) never
  // moves the page.
  const scrollY = window.scrollY;

  const basketRecipes = [...basket].map(id => recipes.find(r => r.id === id)).filter(Boolean);
  const groups = buildShoppingList();

  const chipsHtml = basketRecipes.map(r => `
    <span class="basket-chip">${r.title} <button onclick="removeFromBasket('${r.id}')" aria-label="Remove ${r.title} from shopping list">×</button></span>
  `).join('');

  const sectionsHtml = groups.map(({ section, items }) => `
    <section class="recipe-section">
      <h2 class="section-heading">${section}</h2>
      <ul class="shopping-items">
        ${items.map(item => {
          const checked = checkedItems.has(item.name);
          return `
          <li class="shopping-item${checked ? ' checked' : ''}">
            <label class="shopping-item-label">
              <input type="checkbox" class="shopping-item-checkbox" data-name="${item.name}" ${checked ? 'checked' : ''} onchange="toggleChecked(this.dataset.name)">
              <div class="shopping-item-main">
                <span class="shopping-item-name">${item.name}</span>
                <span class="shopping-item-recipe">${item.recipeTitles.join(', ')}</span>
              </div>
            </label>
          </li>
        `;
        }).join('')}
      </ul>
    </section>
  `).join('');

  const hasUnchecked = groups.some(({ items }) => items.some(item => !checkedItems.has(item.name)));

  document.getElementById('shopping-list-content').innerHTML = `
    <header class="recipe-header">
      <p class="recipe-label">Shopping list — ${basketRecipes.length} recipe${basketRecipes.length !== 1 ? 's' : ''}</p>
      <h1 class="recipe-title" id="shopping-list-title" tabindex="-1">Shopping <em>List</em></h1>
      ${basketRecipes.length ? `<div class="basket-chips">${chipsHtml}</div>` : ''}
    </header>

    ${basketRecipes.length ? `
      <div class="shopping-actions">
        ${hasUnchecked ? `
          <a class="whatsapp-btn" href="${buildWhatsAppUrl(groups)}" target="_blank" rel="noopener">Send to WhatsApp</a>
          <button class="copy-list-btn" aria-live="polite" onclick="copyShoppingList(this)">Copy list</button>
        ` : `<span class="all-checked-note">Everything's checked off</span>`}
        <button class="clear-list-btn" onclick="clearBasket()">Clear list</button>
      </div>
      ${sectionsHtml}
    ` : `<p class="no-results">Your shopping list is empty. Add recipes from the index or a recipe page.</p>`}

    <hr class="footer-rule">
  `;

  window.scrollTo(0, scrollY);
}

// Full transition into the shopping list view — scrolls to top and
// moves focus to the heading. Only call this when actually navigating
// to the view; use renderShoppingListContent() for in-place updates.
function renderShoppingListView() {
  renderShoppingListContent();
  showView('shopping-list');
  document.title = 'Shopping List – My Recipes';
  window.scrollTo(0, 0);
  document.getElementById('shopping-list-title').focus();
}

function showView(name) {
  document.getElementById('index').style.display = name === 'index' ? 'block' : 'none';
  document.getElementById('recipe-view').style.display = name === 'recipe' ? 'block' : 'none';
  document.getElementById('shopping-list-view').style.display = name === 'shopping-list' ? 'block' : 'none';
}

// ─────────────────────────────────────────────
//  ROUTING — each recipe gets a shareable #slug URL
// ─────────────────────────────────────────────

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === 'shopping-list') {
    renderShoppingListView();
    return;
  }
  const recipe = recipes.find(r => r.id === id);
  if (recipe) {
    renderRecipe(recipe);
  } else {
    renderIndexView();
  }
}

// Re-renders whichever view is currently on screen, without the
// scroll/focus/display side effects `route()` triggers — used after
// a basket change so the visible toggle buttons stay in sync.
function refreshCurrentView() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === 'shopping-list') {
    renderShoppingListView();
    return;
  }
  const recipe = recipes.find(r => r.id === id);
  if (recipe) {
    renderRecipe(recipe);
  } else {
    renderList();
  }
}

function showRecipe(id) {
  location.hash = id;
}

function showShoppingList() {
  location.hash = 'shopping-list';
}

function showIndex() {
  if (location.hash) {
    history.pushState('', document.title, location.pathname + location.search);
  }
  renderIndexView();
}

window.addEventListener('hashchange', route);

buildFilters();
renderList();
renderBasketBadge();

const initialId = decodeURIComponent(location.hash.slice(1));
if (initialId === 'shopping-list') {
  renderShoppingListView();
} else {
  const initialRecipe = recipes.find(r => r.id === initialId);
  if (initialRecipe) renderRecipe(initialRecipe);
}
</script>
</body>
